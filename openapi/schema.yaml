  /api/v1/auth/sign-in/:
    post:
      operationId: auth_sign_in
      description: 'Starts a session. A client address that has failed several sign-ins
        is first asked for a bot challenge: `400` `captcha_required` (`attr` `captcha_token`)
        until it sends the token of a solved Turnstile widget (action `sign_in`) as
        `captcha_token`, `400` `captcha_invalid` for a token that is wrong, expired
        or used (it counts as a failed attempt); the token is single use, so a repeated
        attempt needs a new one. The email is looked up next. Errors: `401` `email_not_registered`
        (`attr` `email`: no account has it, whatever the password is, even blank),
        `401` `wrong_password` (`attr` `password`: the email has an account and the
        password is wrong), `401` `invalid_credentials` (any other failed sign-in,
        such as a deactivated account), `403` `email_not_verified` (only after the
        right password; the app opens the verify screen), `429` `sign_in_locked` (even
        the right password, while the account or the client address is locked; `Retry-After`
        is the remaining lock time) or `throttled`; `503` `service_unavailable` while
        the limit store is down, with `Retry-After`. Telling an unknown email from
        a wrong password lets anyone learn which emails have an account (ADR 0012);
        the limits are the brake, so a client must not retry automatically.'
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedInResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated, or the credentials, token or session are
            not valid; the `code` says which.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The credentials are right but the request is not allowed; the
            `code` says why.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/sign-out/:
    post:
      operationId: auth_sign_out
      description: 'Ends the session at once. Send the bearer access token, or, when
        it has expired, the `refresh_token` in the body, so the device need not refresh
        first. Signing out a session that has already ended is not an error when the
        `refresh_token` is sent: it answers `204`, and so does a second call with
        the same `refresh_token`. Errors: `401`, and the `code` depends on what was
        sent. With the access token only: `token_expired` (refresh, or send the `refresh_token`),
        `token_invalid`, or the code of the session''s end (`session_signed_out`,
        `session_revoked_by_user`, `session_password_changed`, `session_email_changed`,
        `session_token_reuse` or `session_expired`; the session is over, so the device
        is already signed out). With a `refresh_token` in the body: only `token_invalid`,
        when neither token is valid. It never answers `503`.'
      summary: Sign out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
      security:
