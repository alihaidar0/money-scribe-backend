openapi: 3.0.3
info:
  title: API
  version: 0.1.0
  description: The HTTP API of this project, generated from its code.
paths:
  /api/v1/accounts/:
    get:
      operationId: account_list
      description: 'The accounts in the order they were made (the default "Card" before
        "Cash"). Cursor pagination (`limit`, `cursor`; follow `next`): ask `limit=100`
        to get the whole list in one call. A person who deleted every account gets
        `200` with an empty `results`.'
      summary: The person's accounts
      parameters:
      - name: cursor
        required: false
        in: query
        description: An opaque position taken from `next` or `previous`; never built
          by the client.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: 'How many results a page holds: 50 by default, at most 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      tags:
      - accounts
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
    post:
      operationId: account_create
      description: Needs an `Idempotency-Key`. A person has at most 20 accounts (`409`
        `account_limit_reached`). The name is unique per person in any case (`400`
        `name_taken`, `attr` `name`). Every account gets "Card" and "Cash" when its
        email is verified, in the language of the account; they are ordinary accounts.
      summary: Add an account
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'A random id, once per user action, as a quoted string of 16
          to 64 letters, digits, hyphens or underscores (a UUID fits): `"8e03978e-40d5-43e8-bc93-6894a57f9324"`.
          Repeat the same request with the same key after a lost answer and nothing
          is created twice; the answer is replayed with `Idempotent-Replayed: true`.
          The key is honoured for 24 hours. Without it: `400` `idempotency_key_required`
          (`attr` `idempotency_key`).'
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '201':
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '`true` when this is the stored answer of an earlier request
                with the same key.'
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The `Idempotency-Key` was already used for a different request.
            The `code` is `idempotency_key_reused`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/accounts/{id}/:
    get:
      operationId: account_read
      description: The account, or `404` when it is not the person's. Answers the
        `ETag` of its `version`.
      summary: Read an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: account_update
      description: 'Changes `name` and `kind`. Send `If-Match` with the `version`:
        a stale one is `412` and changes nothing. A name that is taken is `400` `name_taken`.
        Any other field is `400` `read_only`.'
      summary: Change an account
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: 'The `version` of the record the edit was made from, as a quoted
          string: `"3"` (`*` matches any record). If the stored version is another
          one nothing changes and the answer is `412` `precondition_failed`. Without
          the header the last write wins.'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountInputRequest'
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The `If-Match` version is not the stored one, or `If-None-Match:
            *` found the record. Nothing was changed: reload the record. The `code`
            is `precondition_failed`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
    delete:
      operationId: account_delete
      description: 'Deletes the account (`204`); `If-Match` is checked as for a change.
        An account that has transactions is refused and nothing changes: `409` `account_has_transactions`.
        A repeated delete is `404`: treat it as done.'
      summary: Delete an account
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: 'The `version` of the record the edit was made from, as a quoted
          string: `"3"` (`*` matches any record). If the stored version is another
          one nothing changes and the answer is `412` `precondition_failed`. Without
          the header the last write wins.'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '204':
          description: No response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The `If-Match` version is not the stored one, or `If-None-Match:
            *` found the record. Nothing was changed: reload the record. The `code`
            is `precondition_failed`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/account/delete/:
    post:
      operationId: auth_account_delete
      description: 'Needs the password. Deletes the account and **all** its data at
        once and for good, in one transaction, and every session ends with it (the
        tokens stop working at once). Nothing is kept: no soft delete and no anonymised
        copy. The address is used only for a confirmation email. It is `POST` with
        a body, not `DELETE`, because a `DELETE` body has no defined meaning and proxies
        may drop it. Errors: `400` `invalid_password` (`attr` `password`); `429` `password_attempts_exceeded`
        (shared with the password change) or `throttled`, each with `Retry-After`;
        `503` `service_unavailable` while the limit store is down, with `Retry-After`.'
      summary: Delete the account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/device-keys/:
    get:
      operationId: auth_device_key_list
      description: The person's own keys, newest first, with `is_current` on the one
        of the calling device. A signed-out phone has no session but may still hold
        a key, so the keys have their own list. An account with none is `200` with
        an empty `results`. The list holds at most 5 keys, so it is one page in the
        envelope of every list (`next` and `previous` are `null`); it moves onto the
        cursor class without a change of shape.
      summary: List the fingerprint sign-in keys
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKeyList'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/device-keys/{device_id}/:
    delete:
      operationId: auth_device_key_remove
      description: Deletes the person's key of that device, for example a lost phone's,
        from another device. It answers `204` also when there is none, and for a `device_id`
        that is not theirs it changes nothing and answers the same, so the call reveals
        nothing about other accounts.
      summary: Remove the fingerprint sign-in key of a device
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '204':
          description: No response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/device-keys/challenge/:
    post:
      operationId: auth_device_key_challenge
      description: 'Step 1 of a fingerprint sign-in, and of registering a key. Answers
        32 random bytes (`challenge`, base64url without padding) and their `challenge_id`;
        the challenge lives 2 minutes and works once. The answer has the same shape
        for every `device_id`, known or not, so it reveals nothing. Sign the text
        of ADR 0018 that contains the challenge exactly as sent. Errors: `429` `throttled`
        with `Retry-After`; `503` `service_unavailable` while the limit store is down,
        with `Retry-After`.'
      summary: Ask for a challenge to sign
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceKeyChallengeRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKeyChallengeResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/device-keys/current/:
    put:
      operationId: auth_device_key_register
      description: 'Step 2 of 2 (after `auth_device_key_challenge`). Registers the
        public key of the calling session''s device, or replaces the one it had, also
        when another account held it. Needs the current password. The signature proves
        the phone holds the private key: it signs `money-scribe/device-key-registration/v1`,
        the `challenge_id`, the challenge, the `device_id` and the account id, joined
        by newlines. An Android key also needs its attestation chain, whose challenge
        is the 32 raw bytes of the challenge. The owner is emailed. `201` for a new
        key, `200` for a replaced one. Errors: `400` `invalid_password` (`attr` `current_password`),
        `challenge_invalid` (`attr` `challenge_id`: unknown, used or expired, asked
        for another device, or a wrong proof), `public_key_invalid` (`attr` `public_key`),
        `attestation_invalid` (`attr` `attestation_chain`; no reason is given) or
        `platform_not_supported` (a `web` session); `409` `device_key_limit_reached`
        (the account has 5 keys); `429` `password_attempts_exceeded` (the lock shared
        with the password change) or `throttled`, each with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, or when Google''s revocation list cannot be
        reached, with `Retry-After`.'
      summary: Register the fingerprint sign-in key of this device
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceKeyRegisterRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKey'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKey'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
    delete:
      operationId: auth_device_key_remove_current
      description: Deletes the key of the calling session's device. It answers `204`
        also when there is none.
      summary: Turn off fingerprint sign-in on this device
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '204':
          description: No response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/device-keys/sign-in/:
    post:
      operationId: auth_device_key_sign_in
      description: 'Starts a session from a signature made with the hardware key of
