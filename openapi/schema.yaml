            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defaults'
          description: ''
  /api/v1/salary/months/{month}/fixed-items/:
    post:
      operationId: salary_fixed_item_create
      description: Adds a fixed income or expense to a saved month (`404` when the
        month is not saved). Needs an `Idempotency-Key`. The item has no currency
        of its own; one that is sent must be the month's (`400` `currency_mismatch`).
        A month holds at most 100 items (`409` `fixed_item_limit_reached`). The month's
        `fixed_totals` and `balances` change, so the app reads the month again.
      summary: Add a fixed item to a month
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'A random id, once per user action, as a quoted string of 16
          to 64 letters, digits, hyphens or underscores (a UUID fits): `"8e03978e-40d5-43e8-bc93-6894a57f9324"`.
          Repeat the same request with the same key after a lost answer and nothing
          is created twice; the answer is replayed with `Idempotent-Replayed: true`.
          The key is honoured for 24 hours. Without it: `400` `idempotency_key_required`
          (`attr` `idempotency_key`).'
        required: true
      - in: path
        name: month
        schema:
          type: string
        description: The month, `YYYY-MM`, from 2000-01 to 2099-12. Any other key
          is not a route (a plain `404`).
        required: true
      tags:
      - salary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedItemInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '201':
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '`true` when this is the stored answer of an earlier request
                with the same key.'
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedItem'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The `Idempotency-Key` was already used for a different request.
            The `code` is `idempotency_key_reused`.
  /api/v1/salary/months/{month}/fixed-items/copy/:
    post:
      operationId: salary_fixed_items_copy
      description: 'Adds the fixed items of another saved month to this one (`name`,
        `amount`, `kind`, `part`, with new ids) and answers this month. Needs an `Idempotency-Key`.
        `from` is the month to copy from; without it, the most recent saved month
        before this one. Errors: `404` for a month or a source that is not saved (also
        when there is no earlier month); `400` on `from` when it is the month itself
        or has another currency (`currency_mismatch`); `409` `fixed_item_limit_reached`
        with nothing copied when the total would pass 100. A source with no items
        copies nothing and is not an error.'
      summary: Copy the fixed items of another month
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'A random id, once per user action, as a quoted string of 16
          to 64 letters, digits, hyphens or underscores (a UUID fits): `"8e03978e-40d5-43e8-bc93-6894a57f9324"`.
          Repeat the same request with the same key after a lost answer and nothing
          is created twice; the answer is replayed with `Idempotent-Replayed: true`.
          The key is honoured for 24 hours. Without it: `400` `idempotency_key_required`
          (`attr` `idempotency_key`).'
        required: true
      - in: path
        name: month
        schema:
          type: string
        description: The month, `YYYY-MM`, from 2000-01 to 2099-12. Any other key
          is not a route (a plain `404`).
        required: true
      tags:
      - salary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyFixedItemsRequest'
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '`true` when this is the stored answer of an earlier request
                with the same key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryMonth'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The `Idempotency-Key` was already used for a different request.
            The `code` is `idempotency_key_reused`.
  /api/v1/settings/:
    get:
      operationId: settings_read
      description: Every setting, with the app's own default for one that was never
        set (language `en`, time zone `UTC`, currency `RUB`, one payment, pay days
        20 and 5, reminders off). The first read makes the row, so there is always
        a `version` and an `ETag`.
      summary: Read the settings
      tags:
      - settings
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
    patch:
      operationId: settings_update
      description: 'Changes the fields sent and answers all the settings. The language
        and the time zone are the ones the emails, the reminders and "today" use (sign-in
        still sets them from the device it happens on). `default_currency`, `payment_mode`,
        `first_pay_day` and `second_pay_day` can be sent as `null` to go back to "not
        set". Send `If-Match` with the `version` read: a stale one is `412` and changes
        nothing. Errors: `400` on the field that is wrong (`invalid_choice`, `invalid`,
        `min_value`, `max_value`, `null` for a field that cannot be cleared), `400`
        `read_only` for a field that is not a setting.'
      summary: Change the settings
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        description: 'The `version` of the record the edit was made from, as a quoted
          string: `"3"` (`*` matches any record). If the stored version is another
          one nothing changes and the answer is `412` `precondition_failed`. Without
          the header the last write wins.'
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettingsUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          headers:
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The `If-Match` version is not the stored one, or `If-None-Match:
            *` found the record. Nothing was changed: reload the record. The `code`
            is `precondition_failed`.'
components:
  schemas:
    AlgorithmEnum:
      enum:
      - ES256
      type: string
      description: '* `ES256` - ES256'
    Balances:
      type: object
      properties:
        first:
          allOf:
          - $ref: '#/components/schemas/SignedAmount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        second:
          allOf:
          - $ref: '#/components/schemas/SignedAmount'
          readOnly: true
          nullable: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        month:
          allOf:
          - $ref: '#/components/schemas/SignedAmount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
      required:
      - first
      - month
      - second
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password in use now.
          maxLength: 1024
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: The new password, under the same rules as at registration.
            It must differ from the current one.
      required:
      - current_password
      - password
    ClientErrorEnum:
      enum:
      - client_error
      type: string
      description: '* `client_error` - Client Error'
    CodeSent:
      type: object
      properties:
        code_expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_available_in:
          type: integer
          description: Seconds until a new code may be requested.
      required:
      - code_expires_in
      - resend_available_in
    CopyFixedItemsRequest:
      type: object
      description: 'The body of the copy: ``{"from": "YYYY-MM"}``, which may be left
        out. ``from`` is a Python keyword.'
      properties:
        from:
          type: string
          minLength: 1
          description: 'The month to copy the items from, `YYYY-MM`. Default: the
            most recent saved month before this one.'
          pattern: ^20[0-9]{2}-(0[1-9]|1[0-2])$
    CurrencyEnum:
      enum:
      - RUB
      - USD
      - EUR
      - GBP
      - TRY
      - SAR
      - AED
      - EGP
      - JPY
      - KWD
      type: string
      description: |-
        * `RUB` - RUB
        * `USD` - USD
        * `EUR` - EUR
        * `GBP` - GBP
        * `TRY` - TRY
        * `SAR` - SAR
        * `AED` - AED
        * `EGP` - EGP
        * `JPY` - JPY
        * `KWD` - KWD
    Defaults:
      type: object
      description: The inputs that pre-fill the form of a month that is not saved
        yet.
      properties:
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        base_salary:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          nullable: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        food_per_day:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          nullable: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        working_days_in_month:
          type: integer
          readOnly: true
          nullable: true
        working_hours_in_month:
          type: integer
          readOnly: true
          nullable: true
        extra_hours_hundredths:
          type: integer
          readOnly: true
        tax_rate_basis_points:
          type: integer
          readOnly: true
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          readOnly: true
        working_days_first_half:
          type: integer
          readOnly: true
          nullable: true
        first_pay_day:
          type: integer
          readOnly: true
        second_pay_day:
          type: integer
          readOnly: true
      required:
      - base_salary
      - currency
      - extra_hours_hundredths
      - first_pay_day
      - food_per_day
      - payment_mode
      - second_pay_day
      - tax_rate_basis_points
      - working_days_first_half
      - working_days_in_month
      - working_hours_in_month
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: The current password, to confirm the deletion.
          maxLength: 1024
      required:
      - password
    DeviceKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_id:
          type: string
          format: uuid
          readOnly: true
        device_name:
          type: string
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        attested:
          type: boolean
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
          description: Whether this is the key of the device that made the request.
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attested
      - created_at
      - device_id
      - device_name
      - expires_at
      - id
      - is_current
      - last_used_at
      - platform
    DeviceKeyChallengeRequest:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: The `device_id` of the app install (the same random id as in
            the `device` object).
      required:
      - device_id
    DeviceKeyChallengeResponse:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        challenge:
          type: string
          description: 32 random bytes in base64url without padding. Sign it exactly
            as sent.
        expires_in:
          type: integer
          description: Seconds the challenge lives (120). It works once.
      required:
      - challenge
      - challenge_id
      - expires_in
    DeviceKeyList:
      type: object
      description: The envelope of every list (ADR 0003). This list holds at most
        five keys, so it is one page.
      properties:
        next:
          type: string
          nullable: true
          description: 'Always `null`: the list fits one page.'
        previous:
          type: string
          nullable: true
          description: 'Always `null`: the list fits one page.'
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeviceKey'
      required:
      - next
      - previous
      - results
    DeviceKeyRegisterRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password in use now.
          maxLength: 1024
        public_key:
          type: string
          minLength: 1
          description: 'The public key of the device: P-256, SPKI DER in standard
            base64 with padding.'
          maxLength: 256
        algorithm:
          allOf:
          - $ref: '#/components/schemas/AlgorithmEnum'
          description: |-
            Only `ES256` (ECDSA on P-256 with SHA-256).

            * `ES256` - ES256
        challenge_id:
          type: string
          format: uuid
          description: The `challenge_id` of `auth_device_key_challenge`.
        signature:
          type: string
          minLength: 1
          description: The DER signature, in standard base64 with padding, of the
            registration text.
          maxLength: 256
        attestation_chain:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 8192
          nullable: true
          description: 'Android only: the certificate chain of the key attestation,
            leaf first, each certificate DER in standard base64. Required for an Android
            session; `null` or left out on iOS.'
          maxItems: 10
      required:
      - algorithm
      - challenge_id
      - current_password
      - public_key
      - signature
    DeviceKeySignInRequest:
      type: object
      description: '``language`` and ``time_zone``: the device the user signs in on
        decides them.'
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        challenge_id:
          type: string
          format: uuid
          description: The `challenge_id` of `auth_device_key_challenge`.
        signature:
          type: string
          minLength: 1
          description: The DER signature, in standard base64 with padding, of the
            sign-in text.
          maxLength: 256
        device:
          $ref: '#/components/schemas/DeviceRequest'
      required:
      - challenge_id
      - device
      - signature
    DeviceRequest:
      type: object
      description: The label of the device, for the user's own "active sessions" screen
        (ADR 0009).
      properties:
        device_id:
          type: string
          format: uuid
          description: A random UUID the app creates once at install and keeps in
            secure storage.
        device_name:
          type: string
          minLength: 1
          description: A readable model name such as `Pixel 8`.
          maxLength: 100
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        os_version:
          type: string
          default: ''
          maxLength: 50
        app_version:
          type: string
          minLength: 1
          description: For example `1.0.0+1`.
          maxLength: 50
      required:
      - app_version
      - device_id
      - device_name
      - platform
    EmailChangeConfirmRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: The 6-digit code mailed to the new address.
          pattern: ^[0-9]{6}$
      required:
      - code
    EmailChangeRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: The new address.
          maxLength: 254
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password in use now.
          maxLength: 1024
      required:
      - current_password
      - email
    EmailChangeResponse:
      type: object
      properties:
        code_expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_available_in:
          type: integer
          description: Seconds until a new code may be requested.
        email:
          type: string
          format: email
          description: The new address the code was mailed to.
      required:
      - code_expires_in
      - email
      - resend_available_in
    Error400Response:
      type: object
      description: '``validation_error``: invalid input. ``client_error``: an unreadable
        request body.'
      properties:
        type:
          $ref: '#/components/schemas/Error400ResponseTypeEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    Error400ResponseTypeEnum:
      enum:
      - validation_error
      - client_error
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `client_error` - Client Error
    ErrorItem:
      type: object
      properties:
        code:
          type: string
          description: 'A stable, machine-readable code; act on it, not on `detail`.
            Registered codes: `invalid_credentials`, `email_not_registered`, `wrong_password`,
            `captcha_required`, `captcha_invalid`, `token_expired`, `token_invalid`,
            `session_signed_out`, `session_revoked_by_user`, `session_password_changed`,
            `session_email_changed`, `session_token_reuse`, `session_expired`, `email_not_verified`,
            `sign_in_locked`, `throttled`, `device_sign_in_failed`, `challenge_invalid`,
            `public_key_invalid`, `attestation_invalid`, `platform_not_supported`,
            `device_key_limit_reached`, `code_invalid`, `code_expired`, `code_attempts_exceeded`,
            `resend_too_soon`, `resend_limit_reached`, `email_already_registered`,
            `email_unchanged`, `invalid_password`, `password_too_short`, `password_too_long`,
            `password_too_similar`, `password_compromised`, `password_too_common`,
            `password_unchanged`, `password_attempts_exceeded`, `reset_token_invalid`,
            `idempotency_key_required`, `idempotency_key_invalid`, `idempotency_key_reused`,
            `idempotency_in_progress`, `precondition_failed`, `fixed_item_limit_reached`,
            `month_has_fixed_items`, `service_unavailable`, `invalid_amount`, `currency_mismatch`,
            `exceeds_remaining`, `account_has_transactions`, `category_has_transactions`,
            `category_is_builtin`. Codes raised by the framework for malformed or
            incomplete input: `required`, `blank`, `null`, `invalid`, `max_length`,
            `min_length`, `parse_error`, `authentication_failed`, `not_authenticated`,
            `permission_denied`, `not_found`, `method_not_allowed`, `not_acceptable`,
            `unsupported_media_type`, `read_only`. A client treats a code it does
            not know as a generic failure of the status.'
        detail:
          type: string
          description: Human-readable text; not for display.
        attr:
          type: string
          nullable: true
          description: The field the error belongs to, or null for the request as
            a whole. Sign-in sets it on `email_not_registered` (`email`) and `wrong_password`
            (`password`); `invalid_password` is on `current_password` (password change)
            or `password` (account deletion); `reset_token_invalid` is on `reset_token`.
        attempts_left:
          type: integer
          minimum: 0
          description: 'Only on `code_invalid`: how many wrong tries the email code
            still allows.'
        min_length:
          type: integer
          minimum: 1
          description: 'Only on `password_too_short`: the shortest password the server
            accepts.'
        max_length:
          type: integer
          minimum: 1
          description: 'Only on `password_too_long`: the longest password the server
            accepts.'
      required:
      - attr
      - code
      - detail
    ErrorResponse:
      type: object
      description: '``client_error``: a 401, 403, 404, 409 or 429 answer; ``Retry-After``
        accompanies a 429.'
      properties:
        type:
          $ref: '#/components/schemas/ClientErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    FixedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          description: |-
            The currency of the month.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
