  /api/v1/exports/:
    post:
      operationId: export_create
      description: 'Needs the account password (it is `POST` so the password is never
        in a URL). `kinds` is 1 to 5 different values of `accounts`, `categories`,
        `transactions`, `debts`, `salary_months`; `from` and `to` are optional inclusive
        days (both left out is all time; they do not apply to accounts and categories,
        which have no date). One kind is answered as `text/csv; charset=utf-8`, several
        as `application/zip` with `accounts.csv`, `categories.csv`, `transactions.csv`,
        `debts.csv` and `salary_months.csv`, always in this order. The categories
        are the person''s custom ones. The file name is fixed and has no personal
        data and no date. Each file is UTF-8 with a byte order mark, a fixed header
        row, `,`, `\"` quoting, CRLF line ends, oldest first; dates are `YYYY-MM-DD`,
        months `YYYY-MM`, amounts decimal strings of the currency''s digits, an empty
        cell means none. A text cell that a spreadsheet could read as a formula gets
        one `''` in front; the figures and the JSON cells are never changed. Nothing
        in the period is a file with the header row only. The export is rate limited
        (5 an hour), a `data_exported` security event is written and the owner gets
        an email that an export was made. Errors: `400` `invalid_choice`, `min_length`
        or `max_length` on `kinds`, `invalid_date_range` on `to`, `date_out_of_range`,
        `required` or `invalid_password` on `current_password`; `429` `password_attempts_exceeded`
        (shared with the password change) or `throttled`; `503` `service_unavailable`
        while the limit store is down.'
      summary: Export the data as CSV
      tags:
      - exports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          headers:
            Content-Disposition:
              schema:
                type: string
              description: '`attachment; filename="money-scribe-transactions.csv"`
                for one kind, `money-scribe-export.zip` for several: a fixed name
                with no personal data and no date.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/imports/:
    post:
      operationId: import_create
      description: 'The app reads the CSV and sends rows as JSON; the server never
        parses an uploaded file. `dataset` is `transactions`, `debts` or `salary_months`,
        `rows` is 1 to 500 rows, each with its line number `row` (a positive whole
        number, unique in the call) and the fields of the dataset named like the CSV
        columns. Every row goes through the rules of a single create (a `PUT` for
        a salary month) and gets the same codes. The call is one database transaction:
        a row that passes is written, a row that fails is skipped and reported in
        `problems` (the first problem of the row), and the answer is always `200`.
        An import never creates an account or a category (`unknown_category`, `unknown_account`),
        never reads an id, and never overwrites: a row equal to an existing record
        is a `duplicate`, counted by multiplicity, and a salary month that exists
        is a `duplicate`. The record caps apply (`transaction_limit_reached`, `debt_limit_reached`,
        `repayment_limit_reached`, `fixed_item_limit_reached`). A real import needs
        an `Idempotency-Key`; with `dry_run` `true` nothing is written or stored and
        no key is needed. A call that writes at least one row records a `data_imported`
        security event. Limits: 500 rows and 1 MB a call, 120 calls an hour; `503`
        `service_unavailable` while the limit store is down.'
      summary: Import rows of one dataset
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Required unless `dry_run` is `true`: a random id, once per user
          action, as a quoted string of 16 to 64 letters, digits, hyphens or underscores.
          The same key with the same body returns the first answer with `Idempotent-Replayed:
          true`; another body under the same key is `422`.'
      tags:
      - imports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '`true` when this is the stored answer of an earlier request
                with the same key.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The `Idempotency-Key` was already used for a different request.
            The `code` is `idempotency_key_reused`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/overview/months/{month}/:
    get:
      operationId: overview_month
      description: 'What came in, what went out and what is left in one `currency`,
        for the whole month (`total`) and, for a month paid twice, for each part (`first_part`,
        `second_part`; both `null` for a month paid once). A month paid twice follows
        the pay cycle of the Settings pay days (20 and 5 until set): the first part
        runs from the 20th to the 4th of the next month, the second from the 5th to
        the 19th, and the month is both together. A month paid once is the calendar
        month. `balance` is `salary` + `recurring_income` + `income_transactions`
        - `fixed_costs` - `purchases` + `debt_repayments_received` - `debt_repayments_made`.
        The salary and the fixed items are those of the saved month and count only
        when its currency is `currency`; otherwise those lines are 0 and `currencies`
        lists the salary month''s currency. Expenses and repayments count by their
        calendar `date`, an income by the part it joined (its `part`, else the nearest
        pay day); creating a debt is not a movement, a repayment is. `has_data` is
        true when the month has a saved salary month or any transaction or repayment,
        in any currency. A month with nothing is `200` with every line `0.00`. Never
        paginated or cached. An unsupported `currency` is `400` `invalid_choice`.'
      summary: The Overview of a month
      parameters:
      - in: query
        name: currency
        schema:
          enum:
          - RUB
          - USD
          - EUR
          - GBP
          - TRY
          - SAR
          - AED
          - EGP
          - JPY
          - KWD
          type: string
          minLength: 1
        description: |-
          The currency of every amount in the answer. Left out, it is the Settings default currency (`RUB` until set). Data in other currencies is not in the figures; `currencies` lists them.

          * `RUB` - RUB
          * `USD` - USD
          * `EUR` - EUR
          * `GBP` - GBP
          * `TRY` - TRY
          * `SAR` - SAR
          * `AED` - AED
          * `EGP` - EGP
          * `JPY` - JPY
          * `KWD` - KWD
      - in: path
        name: month
        schema:
          type: string
        description: The month, `YYYY-MM`, from 2000-01 to 2099-12. Any other key
          is not a route (a plain `404`).
        required: true
      tags:
      - overview
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/reports/day-totals/:
    get:
      operationId: report_day_totals
      description: 'One item per day that has transactions, newest day first, each
        with its currencies inside: `totals` has one `{currency, total}` per currency,
        ordered by currency code, where `total` is income minus expenses of that day
        in that currency. A day always arrives complete: `limit` (50 by default, 100
        at most) counts days, and `next` follows to the older ones. `date_from` and
        `date_to` are optional and there is no limit on the span. It takes the filters
        of the transaction list except `search`, which is not a parameter of this
        operation. The list and the totals read in step: the same order, the same
        filters. A day with no transaction has no item. A total past the largest amount
        is `400` `invalid_amount`.'
      summary: The total of each day
      parameters:
      - in: query
        name: account_id
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        description: Repeat to match any of up to 20 accounts. An id that matches
          nothing is not an error.
      - in: query
        name: category_id
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        description: Repeat to match any of up to 20 categories. An id that matches
          nothing is not an error.
      - name: cursor
        required: false
        in: query
        description: An opaque position taken from `next` or `previous`; never built
          by the client.
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: The first day, inclusive (`YYYY-MM-DD`).
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: The last day, inclusive (`YYYY-MM-DD`).
      - in: query
        name: kind
        schema:
          enum:
          - expense
          - income
          type: string
          minLength: 1
        description: |-
          * `expense` - Expense
          * `income` - Income
      - name: limit
        required: false
        in: query
        description: 'How many results a page holds: 50 by default, at most 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      tags:
      - reports
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDayTotalList'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/reports/debts/:
    get:
      operationId: report_debts
      description: '`by_currency` has one block per currency that has unsettled debts,
        ordered by currency code: what the person is owed (`owed_to_you`, the `remaining`
        of unsettled debts lent), what they owe (`you_owe`) and the unsettled debts
        themselves, `overdue` (by `due_date`, the oldest first) and `open` (by `due_date`,
