      - id
      - kind
      - name
      - part
      - updated_at
      - version
    FixedItemInputRequest:
      type: object
      description: 'A fixed item to add or to change. It has no currency of its own:
        the month''s.'
      properties:
        name:
          type: string
          minLength: 1
          description: 1 to 50 characters, trimmed.
          maxLength: 50
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        kind:
          $ref: '#/components/schemas/KindEnum'
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          default: first
          description: |-
            Ignored while the month has one payment (every item counts then).

            * `first` - First part
            * `second` - Second part
        day:
          type: integer
          maximum: 31
          minimum: 1
          nullable: true
          description: The day of the month the item falls on, 1 to 31, or `null`
            for none. A day past the end of the month (31 in September) counts as
            its last day; it is stored and returned as sent. It does not change `part`,
            which is still the one sent.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            May be left out. If it is sent it must be the currency of the month.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
      required:
      - amount
      - kind
      - name
