        first_pay_day:
          type: integer
          maximum: 28
          minimum: 1
        second_pay_day:
          type: integer
          maximum: 28
          minimum: 1
        fixed_items:
          type: array
          items:
            $ref: '#/components/schemas/ImportFixedItemRequest'
          description: '`[]` or a left out cell when there are none.'
      required:
      - base_salary
      - currency
      - extra_hours
      - first_pay_day
      - food_per_day
      - month
      - payment_mode
      - row
      - second_pay_day
      - tax_rate
      - working_days_in_month
      - working_hours_in_month
    SalaryMonthInputRequest:
      type: object
      description: The inputs of a month; the server calculates the rest and the client
        never sends a result.
      properties:
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        base_salary:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        food_per_day:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        working_days_in_month:
          type: integer
          maximum: 31
          minimum: 1
        working_hours_in_month:
          type: integer
          maximum: 744
          minimum: 1
        extra_hours_hundredths:
          type: integer
          maximum: 74400
          minimum: 0
          description: 'Hours in hundredths: 750 is 7.5 hours.'
        tax_rate_basis_points:
          type: integer
          maximum: 10000
          minimum: 0
          description: 1300 is 13%.
        payment_mode:
          $ref: '#/components/schemas/PaymentModeEnum'
        working_days_first_half:
          type: integer
          minimum: 0
          nullable: true
          description: The working days of the first half of the month, up to `working_days_in_month`.
            Required with two payments; with one payment it is ignored and stored
            as `null`.
        first_pay_day:
          type: integer
          maximum: 28
          minimum: 1
        second_pay_day:
          type: integer
          maximum: 28
          minimum: 1
      required:
      - base_salary
      - currency
      - extra_hours_hundredths
      - first_pay_day
      - food_per_day
      - payment_mode
      - second_pay_day
      - tax_rate_basis_points
      - working_days_in_month
      - working_hours_in_month
    SecurityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/SecurityEventTypeEnum'
          readOnly: true
          description: |-
            A client treats a type it does not know as an open value.

            * `signed_in` - Signed in
            * `signed_out` - Signed out
            * `session_revoked` - Session revoked
            * `session_limit_reached` - Session limit reached
            * `password_changed` - Password changed
            * `password_reset` - Password reset
            * `email_changed` - Email changed
            * `device_key_added` - Device key added
            * `device_key_removed` - Device key removed
            * `token_reuse_detected` - Token reuse detected
            * `data_exported` - Data exported
            * `data_imported` - Data imported
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        device_name:
          type: string
          readOnly: true
          nullable: true
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
          nullable: true
        app_version:
          type: string
          readOnly: true
          nullable: true
        sign_in_method:
          allOf:
          - $ref: '#/components/schemas/SignInMethodEnum'
          readOnly: true
          nullable: true
          description: |-
            On `signed_in` only.

            * `password` - Password
            * `email_code` - Email code
            * `device_key` - Device key
        session_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: 'The session the entry belongs to, or `null`: the session may
            be gone.'
        kinds:
          type: array
          items:
            type: string
          readOnly: true
          nullable: true
          description: 'On `data_exported` and `data_imported` only: which data (an
            open list).'
        count:
          type: integer
          readOnly: true
          nullable: true
          description: 'On `data_exported` and `data_imported` only: the rows written
            to the file or by the call, in total over the kinds; skipped rows are
            not counted.'
      required:
      - app_version
      - count
      - device_name
      - id
      - kinds
      - occurred_at
      - platform
      - session_id
      - sign_in_method
      - type
    SecurityEventTypeEnum:
      enum:
      - signed_in
      - signed_out
      - session_revoked
      - session_limit_reached
      - password_changed
      - password_reset
      - email_changed
      - device_key_added
      - device_key_removed
      - token_reuse_detected
      - data_exported
      - data_imported
      type: string
      description: |-
        * `signed_in` - Signed in
        * `signed_out` - Signed out
        * `session_revoked` - Session revoked
        * `session_limit_reached` - Session limit reached
        * `password_changed` - Password changed
        * `password_reset` - Password reset
        * `email_changed` - Email changed
        * `device_key_added` - Device key added
        * `device_key_removed` - Device key removed
        * `token_reuse_detected` - Token reuse detected
        * `data_exported` - Data exported
        * `data_imported` - Data imported
    ServerErrorEnum:
      enum:
      - server_error
      type: string
      description: '* `server_error` - Server Error'
    ServerErrorResponse:
      type: object
      description: '``server_error``: a 503 answer, always with ``Retry-After``; its
        one code is ``service_unavailable``.'
      properties:
        type:
          $ref: '#/components/schemas/ServerErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    Session:
      type: object
      description: A session of the person. The serializer is given a ``Session``
        and ``current_id`` in its context.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The session id, also the `sid` of its tokens. An identifier,
            not a credential.
        device_id:
          type: string
          format: uuid
          readOnly: true
          description: The install id of the device; several sessions of one device
            share it, so the app can group them.
        device_name:
          type: string
          readOnly: true
          description: As the device sent it; shown, never parsed.
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
        os_version:
          type: string
          readOnly: true
          description: As the device sent it; shown, never parsed.
        app_version:
          type: string
          readOnly: true
          description: As the device sent it (`1.0.0+1`); shown, never parsed.
        signed_in_at:
          type: string
          format: date-time
          readOnly: true
        last_active_at:
          type: string
          format: date-time
          readOnly: true
          description: Updated at most once every 5 minutes.
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: The 90 day limit of the session.
        is_current:
          type: boolean
          readOnly: true
          description: The session of this very request. Always `false` for an ended
            session.
        sign_in_method:
          allOf:
          - $ref: '#/components/schemas/SignInMethodEnum'
          readOnly: true
        network:
          type: string
          readOnly: true
          nullable: true
          description: The address the session was last seen at, cut to its network
            (`203.0.113.0/24`, a `/48` for IPv6), or `null`. A full address and a
            user agent are never returned.
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: '`null` for an active session. For a session whose refresh
            token ran out it is the moment it ran out.'
        end_reason:
          type: string
          readOnly: true
          nullable: true
          description: '`null` for an active session, else why it ended: `signed_out`,
            `revoked_by_user`, `expired`, `session_limit`, `password_changed`, `password_reset`,
            `email_changed`, `token_reuse` or `replaced`. A client treats a value
            it does not know as a generic "ended".'
      required:
      - app_version
      - device_id
      - device_name
      - end_reason
      - ended_at
      - expires_at
      - id
      - is_current
      - last_active_at
      - network
      - os_version
      - platform
      - sign_in_method
      - signed_in_at
    Settings:
      type: object
      description: Every setting, with the app's own default for one that was never
        set.
      properties:
        language:
          type: string
          readOnly: true
          description: '`en` or `ar`.'
        time_zone:
          type: string
          readOnly: true
          description: An IANA name such as `Asia/Riyadh`.
        default_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          readOnly: true
        first_pay_day:
          type: integer
          readOnly: true
        second_pay_day:
          type: integer
          readOnly: true
        remind_on_pay_days:
          type: boolean
          readOnly: true
        version:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - default_currency
      - first_pay_day
      - language
      - payment_mode
      - remind_on_pay_days
      - second_pay_day
      - time_zone
      - updated_at
      - version
    SignInMethodEnum:
      enum:
      - password
      - email_code
      - device_key
      type: string
      description: |-
        * `password` - Password
        * `email_code` - Email code
        * `device_key` - Device key
    SignInRequest:
      type: object
      description: '``language`` and ``time_zone``: the device the user signs in on
        decides them.'
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
        captcha_token:
          type: string
          writeOnly: true
          description: The token of a solved Cloudflare Turnstile widget created with
            the action `sign_in`. Required only after `captcha_required`; it is single
            use and lives five minutes.
          maxLength: 2048
        device:
          $ref: '#/components/schemas/DeviceRequest'
      required:
      - device
      - email
      - password
    SignOutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Lets a device whose access token has expired end its own session
            without refreshing first.
          maxLength: 2048
    SignedInResponse:
      type: object
      properties:
        access_token:
          type: string
          description: 'Send it as `Authorization: Bearer`.'
        refresh_token:
          type: string
          description: Single-use. Absent when the web form of the tokens carries
            it in a cookie.
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          description: Seconds the access token lives (600).
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access_token
      - expires_in
      - token_type
      - user
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        date:
          type: string
          format: date
          readOnly: true
        category_id:
          type: string
          format: uuid
          readOnly: true
        account_id:
          type: string
          format: uuid
          readOnly: true
        note:
          type: string
          readOnly: true
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          readOnly: true
          nullable: true
          description: |-
            Of an income: the payment it joins, the one the person chose or else the one whose pay day is nearest to the `date`. `null` for an expense. Only the Overview of a month paid twice uses it.

            * `first` - First part
            * `second` - Second part
        part_month:
          type: string
          pattern: ^20[0-9]{2}-(0[1-9]|1[0-2])$
          example: 2026-10
          readOnly: true
          nullable: true
          description: 'Of an income: the month the `part` belongs to (`YYYY-MM`).
            `null` for an expense.'
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_id
      - amount
      - category_id
      - created_at
      - currency
      - date
      - id
      - kind
      - note
      - part
      - part_month
      - updated_at
      - version
    TransactionCreateRequest:
      type: object
      description: A transaction to add. Anything else (`id`, `version`, ...) is `400
        read_only`.
      properties:
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          nullable: true
          description: |-
            Income only: the payment of a month paid twice the money joins. Send it with `part_month`, or send both as `null` for the part nearest to the `date`. Ignored by the Overview of a month paid once.

            * `first` - First part
            * `second` - Second part
        part_month:
          type: string
          pattern: ^20[0-9]{2}-(0[1-9]|1[0-2])$
          example: 2026-10
          nullable: true
          description: The month the `part` belongs to, `YYYY-MM` (2000-01 to 2099-12).
        kind:
          $ref: '#/components/schemas/KindEnum'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Of the record, and fixed for good: it cannot be changed afterwards.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        date:
          type: string
          format: date
          description: A calendar day, 2000-01-01 to 2099-12-31.
        category_id:
          type: string
          format: uuid
          description: A built-in category or one of the person's own, and one that
            allows the `kind`.
        account_id:
          type: string
          format: uuid
          description: One of the person's accounts.
        note:
          type: string
          default: ''
          description: 0 to 100 characters, trimmed.
          maxLength: 100
      required:
      - account_id
      - amount
      - category_id
      - currency
      - date
      - kind
    TransactionImportDatasetEnum:
      enum:
      - transactions
      type: string
      description: '* `transactions` - transactions'
    TransactionImportRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: '`true` answers what the call would do and writes nothing,
            stores nothing and needs no `Idempotency-Key`.'
        dataset:
          allOf:
          - $ref: '#/components/schemas/TransactionImportDatasetEnum'
          description: |-
            The rows are `transactions` rows.

            * `transactions` - transactions
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TransactionImportRowRequest'
          description: 1 to 500 rows. A field that is not a column of the dataset
            is a problem `read_only` on it, and an empty cell is left out.
          maxItems: 500
          minItems: 1
      required:
      - dataset
      - rows
    TransactionImportRowRequest:
      type: object
      description: |-
        A transaction of the file. Exactly one of `category_key` (a built-in category) and `category_name` (one of the
        person's own) names its category, and `account_name` an account that exists; none is created.
      properties:
        row:
          type: integer
          minimum: 1
          description: 'The line in the file: a positive whole number, unique in the
            call.'
        date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/KindEnum'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        category_key:
          type: string
          minLength: 1
          maxLength: 20
        category_name:
          type: string
          minLength: 1
          maxLength: 30
        account_name:
          type: string
          minLength: 1
          maxLength: 30
        note:
          type: string
          default: ''
          maxLength: 100
      required:
      - account_name
      - amount
      - currency
      - date
      - kind
      - row
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
      required:
      - email
      - id
      - name
    VerifyEmailRequest:
      type: object
      description: '``language`` and ``time_zone``: the device the user signs in on
        decides them.'
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 1
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
        device:
          $ref: '#/components/schemas/DeviceRequest'
      required:
      - code
      - device
      - email
    Amount:
      type: string
      format: decimal
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
      description: 'A money amount, not negative: a decimal string with exactly the
        number of digits of its currency (`12.50` for USD, `12.500` for KWD, `1200`
        for JPY), a point as the separator, no grouping, no sign, at most 15 digits
        in all. The `currency` field next to it says which currency.'
    SignedAmount:
      type: string
      format: decimal
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
      description: 'A computed money amount that can be negative (a balance, a day
        total): the format of `Amount` with a leading `-` when it is below zero. Zero
        is never written as `-0`.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: 'The id of this request, on every response, errors included. A
        client may send its own `X-Request-ID` (8 to 64 letters, digits and hyphens);
        anything else is replaced. It holds no personal data: show it on a failure
        screen so the request can be found in the server log.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9-]{8,64}$
