openapi: 3.0.3
info:
  title: API
  version: 0.1.0
  description: The HTTP API of this project, generated from its code.
paths:
  /api/v1/auth/account/delete/:
    post:
      operationId: auth_account_delete
      description: 'Needs the password. Deletes the account and **all** its data at
        once and for good, in one transaction, and every session ends with it (the
        tokens stop working at once). Nothing is kept: no soft delete and no anonymised
        copy. The address is used only for a confirmation email. It is `POST` with
        a body, not `DELETE`, because a `DELETE` body has no defined meaning and proxies
        may drop it. Errors: `400` `invalid_password` (`attr` `password`); `429` `password_attempts_exceeded`
        (shared with the password change) or `throttled`, each with `Retry-After`;
        `503` `service_unavailable` while the limit store is down, with `Retry-After`.'
      summary: Delete the account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/device-keys/:
    get:
      operationId: auth_device_key_list
      description: The person's own keys, newest first, with `is_current` on the one
        of the calling device. A signed-out phone has no session but may still hold
        a key, so the keys have their own list. An account with none is `200` with
        an empty `results`. The list holds at most 5 keys, so it is one page in the
        envelope of every list (`next` and `previous` are `null`); it moves onto the
        cursor class without a change of shape.
      summary: List the fingerprint sign-in keys
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKeyList'
          description: ''
  /api/v1/auth/device-keys/{device_id}/:
    delete:
      operationId: auth_device_key_remove
      description: Deletes the person's key of that device, for example a lost phone's,
        from another device. It answers `204` also when there is none, and for a `device_id`
        that is not theirs it changes nothing and answers the same, so the call reveals
        nothing about other accounts.
      summary: Remove the fingerprint sign-in key of a device
      parameters:
      - in: path
        name: device_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
  /api/v1/auth/device-keys/challenge/:
    post:
      operationId: auth_device_key_challenge
      description: 'Step 1 of a fingerprint sign-in, and of registering a key. Answers
        32 random bytes (`challenge`, base64url without padding) and their `challenge_id`;
        the challenge lives 2 minutes and works once. The answer has the same shape
        for every `device_id`, known or not, so it reveals nothing. Sign the text
        of ADR 0018 that contains the challenge exactly as sent. Errors: `429` `throttled`
        with `Retry-After`; `503` `service_unavailable` while the limit store is down,
        with `Retry-After`.'
      summary: Ask for a challenge to sign
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceKeyChallengeRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKeyChallengeResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/device-keys/current/:
    put:
      operationId: auth_device_key_register
      description: 'Step 2 of 2 (after `auth_device_key_challenge`). Registers the
        public key of the calling session''s device, or replaces the one it had, also
        when another account held it. Needs the current password. The signature proves
        the phone holds the private key: it signs `money-scribe/device-key-registration/v1`,
        the `challenge_id`, the challenge, the `device_id` and the account id, joined
        by newlines. An Android key also needs its attestation chain, whose challenge
        is the 32 raw bytes of the challenge. The owner is emailed. `201` for a new
        key, `200` for a replaced one. Errors: `400` `invalid_password` (`attr` `current_password`),
        `challenge_invalid` (`attr` `challenge_id`: unknown, used or expired, asked
        for another device, or a wrong proof), `public_key_invalid` (`attr` `public_key`),
        `attestation_invalid` (`attr` `attestation_chain`; no reason is given) or
        `platform_not_supported` (a `web` session); `409` `device_key_limit_reached`
        (the account has 5 keys); `429` `password_attempts_exceeded` (the lock shared
        with the password change) or `throttled`, each with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, or when Google''s revocation list cannot be
        reached, with `Retry-After`.'
      summary: Register the fingerprint sign-in key of this device
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceKeyRegisterRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKey'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceKey'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
    delete:
      operationId: auth_device_key_remove_current
      description: Deletes the key of the calling session's device. It answers `204`
        also when there is none.
      summary: Turn off fingerprint sign-in on this device
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
  /api/v1/auth/device-keys/sign-in/:
    post:
      operationId: auth_device_key_sign_in
      description: 'Starts a session from a signature made with the hardware key of
        this device, with no password and no email: the key identifies the account.
        The signed text is `money-scribe/device-sign-in/v1`, the `challenge_id`, the
        challenge exactly as sent and the `device_id`, joined by newlines. The answer
        is the one of `auth_sign_in`. Errors: every failure is one `401` `device_sign_in_failed`
        (unknown device, a challenge that is unknown, used, expired or asked for another
        device, a bad signature, an expired key, an inactive account), so the app
        shows the password form; `429` `sign_in_locked` after 5 failures from the
        device or 20 from the client address in 15 minutes (its own lock, apart from
        the password one) or `throttled`, each with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`.'
      summary: Sign in with the device key
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceKeySignInRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedInResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated, or the credentials, token or session are
            not valid; the `code` says which.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/email-change/:
    post:
      operationId: auth_email_change_request
      description: 'Step 1 of 2. Emails a 6-digit code to the **new** address; the
        old one stays in force until the code is accepted by `auth_email_change_confirm`.
        Needs the current password. A new request replaces the earlier pending change.
        Errors: `400` `invalid_password` (`attr` `current_password`), `email_unchanged`
        (`attr` `email`: the account already has it), or `invalid` for a malformed
        address; `409` `email_already_registered` (a signed-in caller who has proved
        the password may be told; no other call says so); `429` `password_attempts_exceeded`
        (the password lock shared with the password change), `resend_too_soon` (60
        second cooldown for the new address), `resend_limit_reached` (5 codes per
        hour for the address, and 5 changes per hour for the account) or `throttled`,
        each with `Retry-After`; `503` `service_unavailable` while the limit store
        is down, with `Retry-After`.'
      summary: Start an email change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
    delete:
      operationId: auth_email_change_cancel
      description: Drops the pending change, so its code stops working. It answers
        `204` also when nothing is pending.
      summary: Cancel the pending email change
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
  /api/v1/auth/email-change/confirm/:
    post:
      operationId: auth_email_change_confirm
      description: 'Step 2 of 2. A correct code switches the sign-in address to the
        new one, ends every **other** session (this one continues, with the same tokens),
        tells the old address by email and answers the updated profile. Errors: `400`
        `code_invalid` (the error item carries `attempts_left`) or `code_expired`
        (also when no change is pending); `409` `email_already_registered` (the address
        was taken meanwhile; the code is kept); `429` `code_attempts_exceeded` (the
        code is dead; `Retry-After` is the wait before a new one may be requested)
        or `throttled`; `503` `service_unavailable` while the limit store is down,
        with `Retry-After`.'
      summary: Confirm the email change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: 'Step 3 of 3. Sets the new password with the `reset_token` and
        ends **all** the user''s sessions, so the app returns to the sign-in screen
        (it signs nobody in). The owner gets an email about the change. Errors: `400`
        `reset_token_invalid` (`attr` `reset_token`: unknown, used or expired; ask
        for a new code), or a password rule on `attr` `password` (`password_too_short`,
        `password_too_long`, `password_too_similar`, `password_too_common`, `password_compromised`),
        after which the same token may be used again until it expires. A new password
        equal to the current one is allowed here: the reset proves the mailbox, not
        the old password. `429` `throttled` with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`.'
      summary: Set the new password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request
      description: 'Step 1 of 3. Emails a 6-digit code to a registered, verified address.
        The answer is the same for every address, whether it has an account or not,
        so it reveals nothing; the app always goes on to the code screen. The code
        lives 10 minutes and shares the hourly budget of the other codes. Errors:
        `429` `resend_too_soon` (the 60 second cooldown), `resend_limit_reached` (5
        codes per hour) or `throttled`, each with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`.'
      summary: Ask for a password reset code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password-reset/verify/:
    post:
      operationId: auth_password_reset_verify
      description: 'Step 2 of 3. A correct code is spent and answered with a single-use
        `reset_token` that lives 10 minutes. It does not sign anyone in. Errors: `400`
        `code_invalid` (the error item carries `attempts_left`) or `code_expired`,
        `429` `code_attempts_exceeded` (the code is dead; `Retry-After` is the wait
        before a new one may be requested) or `throttled`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`. The answers are the same
        for an address with no account.'
      summary: Check the password reset code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTokenResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      description: 'Needs the current password. Ends every **other** session; this
        one continues with the new token pair in the answer, and the previous refresh
        token is retired. The owner gets an email about the change. Errors: `400`
        `invalid_password` (`attr` `current_password`: it is `400`, not `401`, so
        the app''s session handling is not triggered), `password_unchanged` (`attr`
        `password`: the new password equals the current one), or a password rule on
        `attr` `password` (`password_too_short`, `password_too_long`, `password_too_similar`,
        `password_too_common`, `password_compromised`); `429` `password_attempts_exceeded`
        (5 wrong current passwords lock this operation and the account deletion for
        15 minutes; `Retry-After` is the remaining time; sign-in is unaffected) or
        `throttled`; `503` `service_unavailable` while the limit store is down, with
        `Retry-After`.'
      summary: Change the password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
