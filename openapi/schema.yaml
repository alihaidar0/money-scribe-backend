        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/sign-out/:
    post:
      operationId: auth_sign_out
      description: 'Ends the session at once. Send the bearer access token, or, when
        it has expired, the `refresh_token` in the body, so the device need not refresh
        first. Signing out a session that has already ended is not an error when the
        `refresh_token` is sent: it answers `204`, and so does a second call with
        the same `refresh_token`. Errors: `401`, and the `code` depends on what was
        sent. With the access token only: `token_expired` (refresh, or send the `refresh_token`),
        `token_invalid`, or the code of the session''s end (`session_signed_out`,
        `session_revoked_by_user`, `session_password_changed`, `session_email_changed`,
        `session_token_reuse` or `session_expired`; the session is over, so the device
        is already signed out). With a `refresh_token` in the body: only `token_invalid`,
        when neither token is valid. It never answers `503`.'
      summary: Sign out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
