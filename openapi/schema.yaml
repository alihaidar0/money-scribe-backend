        month:
          type: string
          minLength: 1
          description: '`YYYY-MM`.'
          pattern: ^20[0-9]{2}-(0[1-9]|1[0-2])$
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        base_salary:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        food_per_day:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        working_days_in_month:
          type: integer
          maximum: 31
          minimum: 1
        working_hours_in_month:
          type: integer
          minimum: 1
        extra_hours:
          type: string
          minLength: 1
          description: Hours with exactly two decimals, `0.00` to `744.00` (`7.50`
            is seven and a half hours).
          pattern: ^[0-9]+\.[0-9]{2}$
        tax_rate:
          type: string
          minLength: 1
          description: A percent with exactly two decimals, `0.00` to `100.00`.
          pattern: ^[0-9]+\.[0-9]{2}$
        payment_mode:
          $ref: '#/components/schemas/PaymentModeEnum'
        working_days_first_half:
          type: integer
          minimum: 0
          nullable: true
          description: Required with two payments, up to `working_days_in_month`;
