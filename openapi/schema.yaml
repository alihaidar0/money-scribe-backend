    post:
      operationId: category_create
      description: Needs an `Idempotency-Key`. A custom category is always of the
        kind `both` and has no `key`; a `kind` in the request is `400` `read_only`.
        The `icon` is one of the eight the picker offers (`400` `invalid_choice`).
        The name is unique among the person's custom categories in any case and is
        not a built-in key or English name (`400` `name_taken`). A person has at most
        50 custom categories (`409` `category_limit_reached`); the built-in ones do
        not count.
      summary: Add a custom category
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'A random id, once per user action, as a quoted string of 16
          to 64 letters, digits, hyphens or underscores (a UUID fits): `"8e03978e-40d5-43e8-bc93-6894a57f9324"`.
          Repeat the same request with the same key after a lost answer and nothing
          is created twice; the answer is replayed with `Idempotent-Replayed: true`.
          The key is honoured for 24 hours. Without it: `400` `idempotency_key_required`
          (`attr` `idempotency_key`).'
        required: true
