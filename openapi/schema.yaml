          type: string
          minLength: 1
          description: The 6-digit code mailed to the new address.
          pattern: ^[0-9]{6}$
      required:
      - code
    EmailChangeRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: The new address.
          maxLength: 254
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password in use now.
          maxLength: 1024
      required:
      - current_password
      - email
    EmailChangeResponse:
      type: object
      properties:
        code_expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_available_in:
          type: integer
          description: Seconds until a new code may be requested.
        email:
          type: string
          format: email
          description: The new address the code was mailed to.
      required:
      - code_expires_in
      - email
      - resend_available_in
    Error400Response:
      type: object
      description: '``validation_error``: invalid input. ``client_error``: an unreadable
        request body.'
      properties:
        type:
          $ref: '#/components/schemas/Error400ResponseTypeEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    Error400ResponseTypeEnum:
      enum:
      - validation_error
      - client_error
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `client_error` - Client Error
    ErrorItem:
      type: object
      properties:
        code:
          type: string
          description: 'A stable, machine-readable code; act on it, not on `detail`.
            Registered codes: `invalid_credentials`, `email_not_registered`, `wrong_password`,
            `captcha_required`, `captcha_invalid`, `token_expired`, `token_invalid`,
            `session_signed_out`, `session_revoked_by_user`, `session_password_changed`,
            `session_email_changed`, `session_token_reuse`, `session_expired`, `session_limit_reached`,
            `email_not_verified`, `sign_in_locked`, `throttled`, `device_sign_in_failed`,
            `challenge_invalid`, `public_key_invalid`, `attestation_invalid`, `platform_not_supported`,
            `device_key_limit_reached`, `code_invalid`, `code_expired`, `code_attempts_exceeded`,
            `resend_too_soon`, `resend_limit_reached`, `email_already_registered`,
            `email_unchanged`, `invalid_password`, `password_too_short`, `password_too_long`,
            `password_too_similar`, `password_compromised`, `password_too_common`,
            `password_unchanged`, `password_attempts_exceeded`, `reset_token_invalid`,
            `name_taken`, `account_limit_reached`, `category_limit_reached`, `does_not_exist`,
            `category_not_allowed`, `transaction_limit_reached`, `date_out_of_range`,
            `invalid_date_range`, `too_many_values`, `invalid_part`, `invalid_pay_days`,
            `amount_below_repaid`, `due_before_start`, `repayment_before_start`, `start_after_repayment`,
            `debt_limit_reached`, `repayment_limit_reached`, `unknown_category`, `unknown_account`,
            `duplicate`, `idempotency_key_required`, `idempotency_key_invalid`, `idempotency_key_reused`,
            `idempotency_in_progress`, `precondition_failed`, `fixed_item_limit_reached`,
            `month_has_fixed_items`, `service_unavailable`, `invalid_characters`,
            `request_too_large`, `invalid_amount`, `currency_mismatch`, `exceeds_remaining`,
            `account_has_transactions`, `category_has_transactions`, `category_is_builtin`.
            Codes raised by the framework for malformed or incomplete input: `required`,
            `blank`, `null`, `invalid`, `max_length`, `min_length`, `parse_error`,
            `authentication_failed`, `not_authenticated`, `permission_denied`, `not_found`,
            `method_not_allowed`, `not_acceptable`, `unsupported_media_type`, `read_only`.
            A client treats a code it does not know as a generic failure of the status.'
        detail:
          type: string
          description: Human-readable text; not for display.
        attr:
          type: string
          nullable: true
          description: The field the error belongs to, or null for the request as
            a whole. Sign-in sets it on `email_not_registered` (`email`) and `wrong_password`
            (`password`); `invalid_password` is on `current_password` (password change)
            or `password` (account deletion); `reset_token_invalid` is on `reset_token`.
        attempts_left:
          type: integer
          minimum: 0
          description: 'Only on `code_invalid`: how many wrong tries the email code
            still allows.'
        min_length:
          type: integer
          minimum: 1
          description: 'Only on `password_too_short`: the shortest password the server
            accepts.'
        max_length:
          type: integer
          minimum: 1
          description: 'Only on `password_too_long`: the longest password the server
            accepts.'
        remaining:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: 'Only on `exceeds_remaining`: what the repayment may be at
            most, an amount in the debt''s currency (what the debt still allows, without
            the repayment that is being changed).'
      required:
      - attr
      - code
      - detail
    ErrorResponse:
      type: object
      description: '``client_error``: a 401, 403, 404, 409 or 429 answer; ``Retry-After``
        accompanies a 429.'
      properties:
        type:
          $ref: '#/components/schemas/ClientErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    ExportRequestRequest:
      type: object
      description: What to export and the password that allows it. ``from`` is a Python
        keyword, so it is added in ``get_fields``.
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/DatasetEnum'
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: 1 to 5 different kinds. One kind is answered as a CSV file,
            several as a ZIP archive with one file per kind (always in the order accounts,
            categories, transactions, debts, salary months).
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The account password; it is never put in a URL.
          maxLength: 1024
        from:
          type: string
          format: date
          description: The first day, inclusive (`YYYY-MM-DD`). It applies to a transaction's
            `date`, a debt's `start_date` and, counted in months, to a salary month's
            month; accounts and categories have no date, so it does not apply to them.
            Both left out means all time.
        to:
          type: string
          format: date
          description: The last day, inclusive (`YYYY-MM-DD`); the same rules as `from`.
      required:
      - current_password
      - kinds
    FixedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          description: |-
            The currency of the month.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          readOnly: true
        day:
          type: integer
          readOnly: true
          nullable: true
          description: The day of the month, 1 to 31, or `null` when the item has
            none (an item saved without one).
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
