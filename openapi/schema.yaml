          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedInResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated, or the credentials, token or session are
            not valid; the `code` says which.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The credentials are right but the request is not allowed; the
            `code` says why.
