  /api/v1/transactions/:
    get:
      operationId: transaction_list
      description: Newest day first, then the entry added last first (`-date`, `-created_at`,
        `-id`). Cursor pagination (`limit` 50 by default, 100 at most; follow `next`).
        The filters narrow the list; the same ones (except `search`) narrow the day
        totals. `search` is a case-insensitive substring of the note, 2 to 100 characters.
        An id that matches nothing, or no match at all, is `200` with an empty `results`.
      summary: The person's transactions
      parameters:
      - in: query
        name: account_id
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        description: Repeat to match any of up to 20 accounts. An id that matches
          nothing is not an error.
      - in: query
        name: category_id
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
        description: Repeat to match any of up to 20 categories. An id that matches
          nothing is not an error.
      - name: cursor
        required: false
        in: query
        description: An opaque position taken from `next` or `previous`; never built
          by the client.
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: The first day, inclusive (`YYYY-MM-DD`).
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: The last day, inclusive (`YYYY-MM-DD`).
      - in: query
        name: kind
        schema:
          enum:
          - expense
          - income
          type: string
          minLength: 1
        description: |-
          * `expense` - Expense
          * `income` - Income
      - name: limit
        required: false
        in: query
        description: 'How many results a page holds: 50 by default, at most 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
          minLength: 2
          maxLength: 100
        description: A case-insensitive substring of the note, 2 to 100 characters;
          `%` and `_` are ordinary characters. A list asked with `search` counts in
          the search rate group.
      tags:
      - transactions
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
    post:
      operationId: transaction_create
      description: Needs an `Idempotency-Key`. `amount` is a decimal string with exactly
        the digits of `currency` and greater than 0; the `kind` carries the sign.
        The `date` is a calendar day from 2000-01-01 to 2099-12-31 (`400` `date_out_of_range`).
        The category must be a built-in one or the person's own and must allow the
        `kind` (`400` `category_not_allowed` on `category_id`); an unknown id, or
        one that belongs to someone else, is `400` `does_not_exist` on its field,
        with the same answer for both. A person has at most 100 000 transactions (`409`
        `transaction_limit_reached`).
      summary: Add a transaction
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'A random id, once per user action, as a quoted string of 16
          to 64 letters, digits, hyphens or underscores (a UUID fits): `"8e03978e-40d5-43e8-bc93-6894a57f9324"`.
          Repeat the same request with the same key after a lost answer and nothing
          is created twice; the answer is replayed with `Idempotent-Replayed: true`.
          The key is honoured for 24 hours. Without it: `400` `idempotency_key_required`
          (`attr` `idempotency_key`).'
        required: true
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '201':
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '`true` when this is the stored answer of an earlier request
                with the same key.'
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The `Idempotency-Key` was already used for a different request.
            The `code` is `idempotency_key_reused`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
