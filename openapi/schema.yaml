        the app goes straight in. Errors: `400` `code_invalid` (the error item carries
        `attempts_left`) or `code_expired`, `429` `code_attempts_exceeded` (the code
        is dead; `Retry-After` is the wait before a new one may be requested) or `throttled`;
        `503` `service_unavailable` while the limit store is down, with `Retry-After`.'
      summary: Verify the email and sign in
