  /api/v1/auth/session-history/:
    get:
      operationId: auth_session_history
      description: What happened to the account, newest first (`occurred_at`, `id`),
        in pages (`limit` 50 by default, 100 at most). Entries are kept 90 days; an
        older one is never returned, even before the purge has run. The types are
        `signed_in`, `signed_out`, `session_revoked`, `session_limit_reached`, `password_changed`,
        `password_reset`, `email_changed`, `device_key_added`, `device_key_removed`,
        `token_reuse_detected`, `data_exported` and `data_imported`; a client treats
        an unknown type, platform or sign-in method as an open value. **Which device
        an entry carries:** for `signed_in`, `signed_out`, `password_changed`, `email_changed`,
        `data_exported` and `data_imported` the device where the action was done;
        for `session_revoked`, `session_limit_reached` and `token_reuse_detected`
        the device of the session that was ended (`session_id` is that session); for
        `device_key_added` and `device_key_removed` the device of the key (`app_version`
        is `null` when the acting session is on another device); `password_reset`
        has no session, so its device fields are `null`. **Imports of long files:**
        an entry is never edited or merged on the server, and an import writes one
        `data_imported` entry for each call that writes at least one row (at most
        500 rows), so a file of 10 000 rows is up to 20 entries; the app may show
        consecutive entries of the same `session_id`, less than 15 minutes apart,
        as one. No IP address, user agent, amount, note or name is in an entry. Failed
        sign-ins and the deletion of the account are not entries.
      summary: The security activity of the account
      parameters:
      - name: cursor
        required: false
        in: query
        description: An opaque position taken from `next` or `previous`; never built
          by the client.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: 'How many results a page holds: 50 by default, at most 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      tags:
      - sessions
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSecurityEventList'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/sessions/:
    get:
      operationId: auth_session_list
      description: '`status=active` (the default) is the live sessions: the current
        one first, then the most recently active, at most 10, always the whole list
        with `next` and `previous` `null` (`limit` and `cursor` are accepted and ignored).
        A session is live when it has not been ended and its refresh token has not
        expired. `status=ended` is the sessions that ended in the last 90 days (never
        older, even before the daily purge has run), newest sign-in first, in pages
        (`limit` 50 by default, 100 at most). Every sign-in is a session, so a device
        that signed in five times has five rows with the same `device_id`; the app
        groups them. A session nobody used for 30 days counts as ended with `end_reason`
        `expired` and `ended_at` the moment its refresh token ran out; nothing is
        written for that. `limit` that is not a whole number of at least 1 is `400`
        `invalid`; a `status` that is not one of the two is `400` `invalid_choice`.'
      summary: The sessions of the account
      parameters:
      - name: cursor
        required: false
        in: query
        description: An opaque position taken from `next` or `previous`; never built
          by the client.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: 'How many results a page holds: 50 by default, at most 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: status
        schema:
          enum:
          - active
          - ended
          type: string
          default: active
          minLength: 1
        description: |-
          `active` (the default): the live sessions, the current one first, at most 10, always the whole list in the cursor envelope. `ended`: the sessions that ended in the last 90 days, newest sign-in first, in pages.

          * `active` - active
          * `ended` - ended
      tags:
      - sessions
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/sessions/{id}/:
    delete:
      operationId: auth_session_end
      description: Ends one of the person's own sessions (`204`). A session that is
        already over is also `204` and nothing changes. An id that is not theirs,
        or does not exist, is `404`. Ending the **current** session is a sign-out
        (the fingerprint key stays; the app uses the sign-out call for this). Ending
        **another** session makes that device answer `401` `session_revoked_by_user`
        on its next call, records a `session_revoked` entry in the security activity,
        and removes the fingerprint key of that session's device (unless it is the
        current device's) in the same transaction; there is no opt-out and the answer
        has no body. It counts in the session actions rate group (30 an hour) and
        keeps working while the limit store is down, because it only reduces access.
      summary: End a session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The session id.
        required: true
      tags:
      - sessions
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '204':
          description: No response body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/auth/sessions/revoke-others/:
    post:
      operationId: auth_session_revoke_others
      description: 'Needs the password. Ends every session but the current one and
        removes every fingerprint key but the current device''s, the keys of signed-out
        phones included, in one transaction. Answers `200` with how many of each;
        with no other sessions `ended` is 0 and the keys of other devices are still
        removed. A wrong password is `400` `invalid_password` on `current_password`;
        too many wrong ones are `429` `password_attempts_exceeded` (the lock shared
        with the password change); a field that is not `current_password` is `400`
        `read_only`. It counts in the session actions rate group (30 an hour) and
        fails closed: `503` `service_unavailable` while the limit store is down.'
