    Amount:
      type: string
      format: decimal
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
      description: 'A money amount, not negative: a decimal string with exactly the
        number of digits of its currency (`12.50` for USD, `12.500` for KWD, `1200`
        for JPY), a point as the separator, no grouping, no sign, at most 15 digits
        in all. The `currency` field next to it says which currency.'
    SignedAmount:
      type: string
      format: decimal
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
      description: 'A computed money amount that can be negative (a balance, a day
        total): the format of `Amount` with a leading `-` when it is below zero. Zero
        is never written as `-0`.'
