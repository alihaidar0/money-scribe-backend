    Debt:
      type: object
      description: |-
        A debt with its repayments and the figures the server derives from them.

        The serializer is given a ``Debt`` and the person's ``today`` (in the context) and writes the derived values.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DebtDirectionEnum'
          readOnly: true
        person:
          type: string
          readOnly: true
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
          description: |-
            The ISO 4217 code of the currency.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        start_date:
          type: string
          format: date
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        note:
          type: string
          readOnly: true
        repaid:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          description: The sum of the repayments.
        remaining:
          allOf:
          - $ref: '#/components/schemas/Amount'
          readOnly: true
          description: The amount minus `repaid`, never below 0.
        status:
          allOf:
          - $ref: '#/components/schemas/DebtStatusEnum'
          readOnly: true
          description: |-
            `settled` when nothing remains; `overdue` when a `due_date` is before the person's day and the debt is not settled; otherwise `open`.

            * `open` - Open
            * `overdue` - Overdue
            * `settled` - Settled
        repayments:
          type: array
          items:
            $ref: '#/components/schemas/Repayment'
          readOnly: true
          description: By `date`, then `id`.
        version:
          type: integer
          readOnly: true
          description: The `ETag` of every answer whose body is the debt, and the
            `If-Match` of its change or delete.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
