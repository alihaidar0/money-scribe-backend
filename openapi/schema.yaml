  /api/v1/salary/months/{month}/fixed-items/:
    post:
      operationId: salary_fixed_item_create
      description: Adds a fixed income or expense to a saved month (`404` when the
        month is not saved). Needs an `Idempotency-Key`. The item has no currency
        of its own; one that is sent must be the month's (`400` `currency_mismatch`).
        A month holds at most 100 items (`409` `fixed_item_limit_reached`). The month's
        `fixed_totals` and `balances` change, so the app reads the month again.
      summary: Add a fixed item to a month
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'A random id, once per user action, as a quoted string of 16
          to 64 letters, digits, hyphens or underscores (a UUID fits): `"8e03978e-40d5-43e8-bc93-6894a57f9324"`.
          Repeat the same request with the same key after a lost answer and nothing
          is created twice; the answer is replayed with `Idempotent-Replayed: true`.
          The key is honoured for 24 hours. Without it: `400` `idempotency_key_required`
          (`attr` `idempotency_key`).'
        required: true
      - in: path
        name: month
        schema:
          type: string
        description: The month, `YYYY-MM`, from 2000-01 to 2099-12. Any other key
          is not a route (a plain `404`).
        required: true
      tags:
      - salary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedItemInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
              schema:
                type: integer
        '201':
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '`true` when this is the stored answer of an earlier request
                with the same key.'
            ETag:
              schema:
                type: string
              description: 'The `version` of the record in the answer, as a quoted
                string: `"3"`.'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedItem'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The `Idempotency-Key` was already used for a different request.
            The `code` is `idempotency_key_reused`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
  /api/v1/salary/months/{month}/fixed-items/copy/:
    post:
      operationId: salary_fixed_items_copy
      description: 'Adds the fixed items of another saved month to this one (`name`,
        `amount`, `kind`, `part`, `day`, with new ids) and answers this month. Needs
        an `Idempotency-Key`. `from` is the month to copy from; without it, the most
        recent saved month before this one. Errors: `404` for a month or a source
