  /api/v1/reports/months/{month}/:
    get:
      operationId: report_month
      description: 'Transactions only, in one `currency`: `income_transactions` is
        the income transactions dated in the month (the salary and the recurring income
        are not included; the Overview has them) and `purchases` is the expense transactions
        (the fixed costs are not included). `categories` is the spending by category,
        the biggest first, and adds up to `purchases`. A month paid twice follows
        the pay cycle of the Settings pay days and also has `first_part` and `second_part`:
        expenses are cut by their own `date`, and an income joins the part it was
        put on or the part with the nearest pay day; a month paid once is the calendar
        month and has `null` for both. Whether the month has parts follows the saved
        salary month, or the Settings payment mode for a month never saved. A month
        with nothing is `200` with zero totals, no categories and `has_data` false.
        Never paginated or cached. An unsupported `currency` is `400` `invalid_choice`.'
      summary: 'The month report: spending by category'
      parameters:
      - in: query
        name: currency
        schema:
          enum:
          - RUB
          - USD
          - EUR
          - GBP
          - TRY
          - SAR
          - AED
          - EGP
          - JPY
          - KWD
          type: string
          minLength: 1
        description: |-
          The currency of every amount in the answer. Left out, it is the Settings default currency (`RUB` until set). Data in other currencies is not in the figures; `currencies` lists them.

          * `RUB` - RUB
