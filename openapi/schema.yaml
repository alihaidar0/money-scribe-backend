    PasswordResetVerifyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 1
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
      required:
      - code
      - email
    PatchedAccountInputRequest:
      type: object
      description: An account to add or to change. Anything else (`id`, `version`,
        ...) is `400 read_only`.
      properties:
        name:
          type: string
          minLength: 1
          description: '1 to 30 characters, trimmed. Unique per person, in any case:
            `400 name_taken`.'
          maxLength: 30
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
    PatchedCategoryInputRequest:
      type: object
      description: A custom category to add or to change. Its kind is always `both`;
        a `kind` here is `400 read_only`.
      properties:
        name:
          type: string
          minLength: 1
          description: '1 to 30 characters, trimmed. Unique among the person''s custom
            categories, in any case, and not a built-in key or English name: `400
            name_taken`.'
          maxLength: 30
        icon:
          allOf:
          - $ref: '#/components/schemas/IconEnum'
          description: |-
            One of the icons the picker offers for a custom category.

            * `gifts` - gifts
            * `health` - health
            * `entertainment` - entertainment
            * `shopping` - shopping
            * `education` - education
            * `travel` - travel
            * `subscriptions` - subscriptions
            * `other` - other
    PatchedDebtUpdateRequest:
      type: object
      description: 'A change to a debt: the fields of the create except the `currency`,
        which is `400 read_only`.'
      properties:
        direction:
          allOf:
          - $ref: '#/components/schemas/DebtDirectionEnum'
          description: |-
            `lent` is money the person gave, `borrowed` money the person received. Flipping it keeps the repayments, the amount and the dates, and the lists, totals and reports follow it on the next read.

            * `lent` - Lent
            * `borrowed` - Borrowed
        person:
          type: string
          minLength: 1
          description: 1 to 50 characters, trimmed.
          maxLength: 50
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: In the debt's currency. Not below what was repaid (`400 amount_below_repaid`);
            above it, a settled debt is open again.
        start_date:
          type: string
          format: date
          description: A calendar day, 2000-01-01 to 2099-12-31. Not after the date
            of a repayment (`400 start_after_repayment`).
        due_date:
          type: string
          format: date
          nullable: true
          description: A calendar day, 2000-01-01 to 2099-12-31. Not before `start_date`.
            `null` clears it.
        note:
          type: string
          description: 0 to 100 characters, trimmed. `""` clears it; `null` is `400`.
          maxLength: 100
    PatchedFixedItemInputRequest:
      type: object
      description: 'A fixed item to add or to change. It has no currency of its own:
        the month''s.'
      properties:
        name:
          type: string
          minLength: 1
          description: 1 to 50 characters, trimmed.
          maxLength: 50
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        kind:
          $ref: '#/components/schemas/KindEnum'
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          default: first
          description: |-
            Ignored while the month has one payment (every item counts then).

            * `first` - First part
            * `second` - Second part
        day:
          type: integer
          maximum: 31
          minimum: 1
          nullable: true
          description: The day of the month the item falls on, 1 to 31, or `null`
            for none. A day past the end of the month (31 in September) counts as
            its last day; it is stored and returned as sent. It does not change `part`,
            which is still the one sent.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            May be left out. If it is sent it must be the currency of the month.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
    PatchedProfileUpdateRequest:
      type: object
      description: Only the name can be edited here; any other field is refused instead
        of silently ignored.
      properties:
        name:
          type: string
          minLength: 1
          description: The display name, 1 to 100 characters, trimmed.
          maxLength: 100
    PatchedRepaymentInputRequest:
      type: object
      description: |-
        A repayment to add or to change. It is in the debt's currency; a `currency` here is `400 read_only`.

        The debt is in the context (``debt``): its currency reads the amount.
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: In the currency of the debt, greater than 0 and not more than
            what remains (`400 exceeds_remaining`, which also carries `remaining`).
        date:
          type: string
          format: date
          description: A calendar day, 2000-01-01 to 2099-12-31. Not before the debt's
            `start_date` (`400 repayment_before_start`).
    PatchedSettingsUpdateRequest:
      type: object
      description: The settings the person may change. Only the fields sent change;
        any other field is ``400 read_only``.
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        default_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          nullable: true
          description: |-
            `null` goes back to "not set": the app's default (`RUB`) applies.

            * `RUB` - RUB
            * `USD` - USD
            * `EUR` - EUR
            * `GBP` - GBP
            * `TRY` - TRY
            * `SAR` - SAR
            * `AED` - AED
            * `EGP` - EGP
            * `JPY` - JPY
            * `KWD` - KWD
        payment_mode:
          allOf:
          - $ref: '#/components/schemas/PaymentModeEnum'
          nullable: true
          description: |-
            How the person is paid. `null` goes back to "not set" (`one_payment`).

            * `one_payment` - One payment
            * `two_payments` - Two payments
        first_pay_day:
          type: integer
          maximum: 28
          minimum: 1
          nullable: true
          description: 1 to 28. `null` goes back to "not set" (20). The first pay
            day starts the first part of a month paid twice; the second pay day must
            be before it, or the change is `400` `invalid_pay_days`.
        second_pay_day:
          type: integer
          maximum: 28
          minimum: 1
          nullable: true
          description: 1 to 28. `null` goes back to "not set" (5). It starts the second
            part, in the month after the first pay day, and must be before the first
            pay day (`400` `invalid_pay_days`; a day never set counts as 20 or 5).
        remind_on_pay_days:
          type: boolean
    PatchedTransactionUpdateRequest:
      type: object
      description: 'A change to a transaction: the fields of the create except `currency`,
        which is `400 read_only`.'
      properties:
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          nullable: true
          description: |-
            Income only: the payment of a month paid twice the money joins. Send it with `part_month`, or send both as `null` for the part nearest to the `date`. Ignored by the Overview of a month paid once.

            * `first` - First part
            * `second` - Second part
        part_month:
          type: string
          pattern: ^20[0-9]{2}-(0[1-9]|1[0-2])$
          example: 2026-10
          nullable: true
          description: The month the `part` belongs to, `YYYY-MM` (2000-01 to 2099-12).
        kind:
          $ref: '#/components/schemas/KindEnum'
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        date:
          type: string
          format: date
          description: A calendar day, 2000-01-01 to 2099-12-31.
        category_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        note:
          type: string
          description: 0 to 100 characters, trimmed.
          maxLength: 100
    Payment:
      type: object
      properties:
        part:
          allOf:
          - $ref: '#/components/schemas/PartEnum'
          readOnly: true
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
