      description: Newest first (`-created_at`, `-id`), each with its `repayments`
        inline and its derived `repaid`, `remaining` and `status`. Cursor pagination
        (`limit` 50 by default, 100 at most; follow `next`). `status` repeats and
        matches any of the values; `search` is a case-insensitive substring of the
        person, 2 to 50 characters. A filter that matches nothing is `200` with an
        empty `results`.
      summary: The person's debts
      parameters:
      - name: cursor
        required: false
        in: query
        description: An opaque position taken from `next` or `previous`; never built
          by the client.
        schema:
          type: string
      - in: query
        name: direction
        schema:
          enum:
          - lent
          - borrowed
          type: string
          minLength: 1
        description: |-
          * `lent` - Lent
          * `borrowed` - Borrowed
      - name: limit
        required: false
        in: query
        description: 'How many results a page holds: 50 by default, at most 100.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
          minLength: 2
          maxLength: 50
        description: A case-insensitive substring of the person, 2 to 50 characters;
          `%` and `_` are ordinary characters. A list asked with `search` counts in
          the search rate group.
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - open
            - overdue
            - settled
          maxItems: 3
        description: Repeat to match any of the statuses.
      - in: query
        name: today
        schema:
          type: string
          format: date
