        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        time_zone:
          type: string
          readOnly: true
      required:
      - email
