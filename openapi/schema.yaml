components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AccountKindEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - name
      - updated_at
      - version
    AccountImportDatasetEnum:
      enum:
      - accounts
      type: string
      description: '* `accounts` - accounts'
    AccountImportRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: '`true` answers what the call would do and writes nothing,
            stores nothing and needs no `Idempotency-Key`.'
        dataset:
          allOf:
          - $ref: '#/components/schemas/AccountImportDatasetEnum'
          description: |-
            The rows are `accounts` rows.

            * `accounts` - accounts
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AccountImportRowRequest'
          description: 1 to 500 rows. A field that is not a column of the dataset
            is a problem `read_only` on it, and an empty cell is left out.
          maxItems: 500
          minItems: 1
      required:
      - dataset
      - rows
    AccountImportRowRequest:
      type: object
      description: An account of the file. One whose name exists, in any case, is
        a `duplicate`.
      properties:
        row:
          type: integer
          minimum: 1
          description: 'The line in the file: a positive whole number, unique in the
            call.'
        name:
          type: string
          minLength: 1
          description: 1 to 30 characters, trimmed.
          maxLength: 30
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
      required:
      - kind
      - name
      - row
    AccountInputRequest:
      type: object
      description: An account to add or to change. Anything else (`id`, `version`,
        ...) is `400 read_only`.
      properties:
        name:
          type: string
          minLength: 1
          description: '1 to 30 characters, trimmed. Unique per person, in any case:
            `400 name_taken`.'
          maxLength: 30
        kind:
          $ref: '#/components/schemas/AccountKindEnum'
      required:
      - kind
      - name
    AccountKindEnum:
      enum:
      - card
      - cash
      - other
      type: string
      description: |-
        * `card` - Card
        * `cash` - Cash
        * `other` - Other
    AlgorithmEnum:
      enum:
      - ES256
      type: string
      description: '* `ES256` - ES256'
    Balances:
      type: object
      properties:
        first:
          allOf:
          - $ref: '#/components/schemas/SignedAmount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        second:
          allOf:
          - $ref: '#/components/schemas/SignedAmount'
          readOnly: true
          nullable: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
        month:
          allOf:
          - $ref: '#/components/schemas/SignedAmount'
          readOnly: true
          description: A decimal string with exactly the number of digits of the currency,
            such as `12.50`.
      required:
      - first
      - month
      - second
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: A custom category's own name; for a built-in one the English
            fallback of its `key`.
        icon:
          type: string
          readOnly: true
          description: A plain slug. Fall back to `other` for one the app does not
            know.
        kind:
          allOf:
          - $ref: '#/components/schemas/CategoryKindEnum'
          readOnly: true
        is_custom:
          type: boolean
          readOnly: true
        key:
          type: string
          readOnly: true
          nullable: true
          description: The stable key of a built-in category (show its name from the
            app's own strings); `null` for a custom one.
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
