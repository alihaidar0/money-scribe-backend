openapi: 3.0.3
info:
  title: API
  version: 0.1.0
  description: The HTTP API of this project, generated from its code.
paths:
  /api/v1/auth/account/delete/:
    post:
      operationId: auth_account_delete
      description: 'Needs the password. Deletes the account and **all** its data at
        once and for good, in one transaction, and every session ends with it (the
        tokens stop working at once). Nothing is kept: no soft delete and no anonymised
        copy. The address is used only for a confirmation email. It is `POST` with
        a body, not `DELETE`, because a `DELETE` body has no defined meaning and proxies
        may drop it. Errors: `400` `invalid_password` (`attr` `password`); `429` `password_attempts_exceeded`
        (shared with the password change) or `throttled`, each with `Retry-After`;
        `503` `service_unavailable` while the limit store is down, with `Retry-After`.'
      summary: Delete the account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/email-change/:
    post:
      operationId: auth_email_change_request
      description: 'Step 1 of 2. Emails a 6-digit code to the **new** address; the
        old one stays in force until the code is accepted by `auth_email_change_confirm`.
        Needs the current password. A new request replaces the earlier pending change.
        Errors: `400` `invalid_password` (`attr` `current_password`), `email_unchanged`
        (`attr` `email`: the account already has it), or `invalid` for a malformed
        address; `409` `email_already_registered` (a signed-in caller who has proved
        the password may be told; no other call says so); `429` `password_attempts_exceeded`
        (the password lock shared with the password change), `resend_too_soon` (60
        second cooldown for the new address), `resend_limit_reached` (5 codes per
        hour for the address, and 5 changes per hour for the account) or `throttled`,
        each with `Retry-After`; `503` `service_unavailable` while the limit store
        is down, with `Retry-After`.'
      summary: Start an email change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
    delete:
      operationId: auth_email_change_cancel
      description: Drops the pending change, so its code stops working. It answers
        `204` also when nothing is pending.
      summary: Cancel the pending email change
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
  /api/v1/auth/email-change/confirm/:
    post:
      operationId: auth_email_change_confirm
      description: 'Step 2 of 2. A correct code switches the sign-in address to the
        new one, ends every **other** session (this one continues, with the same tokens),
        tells the old address by email and answers the updated profile. Errors: `400`
        `code_invalid` (the error item carries `attempts_left`) or `code_expired`
        (also when no change is pending); `409` `email_already_registered` (the address
        was taken meanwhile; the code is kept); `429` `code_attempts_exceeded` (the
        code is dead; `Retry-After` is the wait before a new one may be requested)
        or `throttled`; `503` `service_unavailable` while the limit store is down,
        with `Retry-After`.'
      summary: Confirm the email change
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request conflicts with the current state; the `code` says
            what conflicts.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm
      description: 'Step 3 of 3. Sets the new password with the `reset_token` and
        ends **all** the user''s sessions, so the app returns to the sign-in screen
        (it signs nobody in). The owner gets an email about the change. Errors: `400`
        `reset_token_invalid` (`attr` `reset_token`: unknown, used or expired; ask
        for a new code), or a password rule on `attr` `password` (`password_too_short`,
        `password_too_long`, `password_too_similar`, `password_too_common`, `password_compromised`),
        after which the same token may be used again until it expires. A new password
        equal to the current one is allowed here: the reset proves the mailbox, not
        the old password. `429` `throttled` with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`.'
      summary: Set the new password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password-reset/request/:
    post:
      operationId: auth_password_reset_request
      description: 'Step 1 of 3. Emails a 6-digit code to a registered, verified address.
        The answer is the same for every address, whether it has an account or not,
        so it reveals nothing; the app always goes on to the code screen. The code
        lives 10 minutes and shares the hourly budget of the other codes. Errors:
        `429` `resend_too_soon` (the 60 second cooldown), `resend_limit_reached` (5
        codes per hour) or `throttled`, each with `Retry-After`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`.'
      summary: Ask for a password reset code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password-reset/verify/:
    post:
      operationId: auth_password_reset_verify
      description: 'Step 2 of 3. A correct code is spent and answered with a single-use
        `reset_token` that lives 10 minutes. It does not sign anyone in. Errors: `400`
        `code_invalid` (the error item carries `attempts_left`) or `code_expired`,
        `429` `code_attempts_exceeded` (the code is dead; `Retry-After` is the wait
        before a new one may be requested) or `throttled`; `503` `service_unavailable`
        while the limit store is down, with `Retry-After`. The answers are the same
        for an address with no account.'
      summary: Check the password reset code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTokenResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      description: 'Needs the current password. Ends every **other** session; this
        one continues with the new token pair in the answer, and the previous refresh
        token is retired. The owner gets an email about the change. Errors: `400`
        `invalid_password` (`attr` `current_password`: it is `400`, not `401`, so
        the app''s session handling is not triggered), `password_unchanged` (`attr`
        `password`: the new password equals the current one), or a password rule on
        `attr` `password` (`password_too_short`, `password_too_long`, `password_too_similar`,
        `password_too_common`, `password_compromised`); `429` `password_attempts_exceeded`
        (5 wrong current passwords lock this operation and the account deletion for
        15 minutes; `Retry-After` is the remaining time; sign-in is unaffected) or
        `throttled`; `503` `service_unavailable` while the limit store is down, with
        `Retry-After`.'
      summary: Change the password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/profile/:
    get:
      operationId: auth_profile
      description: The name and email of the signed-in user, and the `language` and
        `time_zone` stored from the device they last signed in on (read-only here).
        The app reads it after a restart, because the tokens carry no profile.
      summary: Read the profile
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: auth_profile_update
      description: 'Changes the display name and answers the updated profile. Only
        `name` can be sent: any other field, such as `email`, `language` or `time_zone`,
        is refused with `400` and the code `read_only` on that field (the email changes
        only through `auth_email_change_request`). Errors: `400` `blank`, `required`
        or `max_length` on `name`.'
      summary: Edit the name
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Trades the single-use refresh token for a new access token and
        a new refresh token. If the answer is lost, the same refresh token sent again
        within 30 seconds of the rotation returns the same new pair; an older used
        token ends the session. Errors: `401` `token_invalid`, `session_expired`,
        `session_signed_out`, `session_revoked_by_user`, `session_password_changed`,
        `session_email_changed` or `session_token_reuse`; all are final, so sign in
        again.'
      summary: Refresh the tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated, or the credentials, token or session are
            not valid; the `code` says which.
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: 'Creates an unverified account and emails a 6-digit code. No session
        is created: the code is verified with `auth_verify_email`, which signs the
        user in. The answer is the same whether the address is new, pending or already
        registered, so it reveals nothing: a pending address is registered again (the
        new name and password replace the earlier ones), and the owner of a registered
        address gets an email saying someone tried, with no code. Errors: `400` field
        errors (password: `password_too_short`, `password_too_long`, `password_too_similar`,
        `password_too_common`, `password_compromised`; `invalid` for an email), `429`
        `resend_too_soon` or `resend_limit_reached` or `throttled`, each with `Retry-After`;
        `503` `service_unavailable` while the limit store is down, with `Retry-After`.'
      summary: Register an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/resend-code/:
    post:
      operationId: auth_resend_code
      description: 'Emails a new code, which replaces every earlier one. The answer
        is the same for every address, so it reveals nothing. Errors: `429` `resend_too_soon`
        (the 60 second cooldown), `resend_limit_reached` (5 codes per hour) or `throttled`,
        each with `Retry-After`; `503` `service_unavailable` while the limit store
        is down, with `Retry-After`.'
      summary: Send a new code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendCodeRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/sign-in/:
    post:
      operationId: auth_sign_in
      description: 'Starts a session. A client address that has failed several sign-ins
        is first asked for a bot challenge: `400` `captcha_required` (`attr` `captcha_token`)
        until it sends the token of a solved Turnstile widget (action `sign_in`) as
        `captcha_token`, `400` `captcha_invalid` for a token that is wrong, expired
        or used (it counts as a failed attempt); the token is single use, so a repeated
        attempt needs a new one. The email is looked up next. Errors: `401` `email_not_registered`
        (`attr` `email`: no account has it, whatever the password is, even blank),
        `401` `wrong_password` (`attr` `password`: the email has an account and the
        password is wrong), `401` `invalid_credentials` (any other failed sign-in,
        such as a deactivated account), `403` `email_not_verified` (only after the
        right password; the app opens the verify screen), `429` `sign_in_locked` (even
        the right password, while the account or the client address is locked; `Retry-After`
        is the remaining lock time) or `throttled`; `503` `service_unavailable` while
        the limit store is down, with `Retry-After`. Telling an unknown email from
        a wrong password lets anyone learn which emails have an account (ADR 0012);
        the limits are the brake, so a client must not retry automatically.'
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedInResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated, or the credentials, token or session are
            not valid; the `code` says which.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The credentials are right but the request is not allowed; the
            `code` says why.
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
  /api/v1/auth/sign-out/:
    post:
      operationId: auth_sign_out
      description: 'Ends the session at once. Send the bearer access token, or, when
        it has expired, the `refresh_token` in the body, so the device need not refresh
        first. Signing out a session that has already ended is not an error when the
        `refresh_token` is sent: it answers `204`, and so does a second call with
        the same `refresh_token`. Errors: `401`, and the `code` depends on what was
        sent. With the access token only: `token_expired` (refresh, or send the `refresh_token`),
        `token_invalid`, or the code of the session''s end (`session_signed_out`,
        `session_revoked_by_user`, `session_password_changed`, `session_email_changed`,
        `session_token_reuse` or `session_expired`; the session is over, so the device
        is already signed out). With a `refresh_token` in the body: only `token_invalid`,
        when neither token is valid. It never answers `503`.'
      summary: Sign out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
      security:
      - bearerAuth: []
      - {}
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '204':
          description: No response body
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email
      description: 'A correct code verifies the address and starts the session, so
        the app goes straight in. Errors: `400` `code_invalid` (the error item carries
        `attempts_left`) or `code_expired`, `429` `code_attempts_exceeded` (the code
        is dead; `Retry-After` is the wait before a new one may be requested) or `throttled`;
        `503` `service_unavailable` while the limit store is down, with `Retry-After`.'
      summary: Verify the email and sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
          description: ''
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedInResponse'
          description: ''
        '503':
          headers:
            Retry-After:
              schema:
                type: integer
              description: Whole seconds to wait before the request may be repeated;
                at least 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
          description: A safety control (the rate-limit store) cannot run, so the
            request is refused before it changes anything; try again after `Retry-After`.
            The `code` is `service_unavailable`.
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password in use now.
          maxLength: 1024
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: The new password, under the same rules as at registration.
            It must differ from the current one.
      required:
      - current_password
      - password
    ClientErrorEnum:
      enum:
      - client_error
      type: string
      description: '* `client_error` - Client Error'
    CodeSent:
      type: object
      properties:
        code_expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_available_in:
          type: integer
          description: Seconds until a new code may be requested.
      required:
      - code_expires_in
      - resend_available_in
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: The current password, to confirm the deletion.
          maxLength: 1024
      required:
      - password
    DeviceRequest:
      type: object
      description: The label of the device, for the user's own "active sessions" screen
        (ADR 0009).
      properties:
        device_id:
          type: string
          format: uuid
          description: A random UUID the app creates once at install and keeps in
            secure storage.
        device_name:
          type: string
          minLength: 1
          description: A readable model name such as `Pixel 8`.
          maxLength: 100
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        os_version:
          type: string
          default: ''
          maxLength: 50
        app_version:
          type: string
          minLength: 1
          description: For example `1.0.0+1`.
          maxLength: 50
      required:
      - app_version
      - device_id
      - device_name
      - platform
    EmailChangeConfirmRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: The 6-digit code mailed to the new address.
          pattern: ^[0-9]{6}$
      required:
      - code
    EmailChangeRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: The new address.
          maxLength: 254
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password in use now.
          maxLength: 1024
      required:
      - current_password
      - email
    EmailChangeResponse:
      type: object
      properties:
        code_expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_available_in:
          type: integer
          description: Seconds until a new code may be requested.
        email:
          type: string
          format: email
          description: The new address the code was mailed to.
      required:
      - code_expires_in
      - email
      - resend_available_in
    Error400Response:
      type: object
      description: '``validation_error``: invalid input. ``client_error``: an unreadable
        request body.'
      properties:
        type:
          $ref: '#/components/schemas/Error400ResponseTypeEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    Error400ResponseTypeEnum:
      enum:
      - validation_error
      - client_error
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `client_error` - Client Error
    ErrorItem:
      type: object
      properties:
        code:
          type: string
          description: 'A stable, machine-readable code; act on it, not on `detail`.
            Registered codes: `invalid_credentials`, `email_not_registered`, `wrong_password`,
            `captcha_required`, `captcha_invalid`, `token_expired`, `token_invalid`,
            `session_signed_out`, `session_revoked_by_user`, `session_password_changed`,
            `session_email_changed`, `session_token_reuse`, `session_expired`, `email_not_verified`,
            `sign_in_locked`, `throttled`, `code_invalid`, `code_expired`, `code_attempts_exceeded`,
            `resend_too_soon`, `resend_limit_reached`, `email_already_registered`,
            `email_unchanged`, `invalid_password`, `password_too_short`, `password_too_long`,
            `password_too_similar`, `password_compromised`, `password_too_common`,
            `password_unchanged`, `password_attempts_exceeded`, `reset_token_invalid`,
            `service_unavailable`, `invalid_amount`, `currency_mismatch`, `exceeds_remaining`,
            `account_has_transactions`, `category_has_transactions`, `category_is_builtin`.
            Codes raised by the framework for malformed or incomplete input: `required`,
            `blank`, `null`, `invalid`, `max_length`, `min_length`, `parse_error`,
            `authentication_failed`, `not_authenticated`, `permission_denied`, `not_found`,
            `method_not_allowed`, `not_acceptable`, `unsupported_media_type`, `read_only`.
            A client treats a code it does not know as a generic failure of the status.'
        detail:
          type: string
          description: Human-readable text; not for display.
        attr:
          type: string
          nullable: true
          description: The field the error belongs to, or null for the request as
            a whole. Sign-in sets it on `email_not_registered` (`email`) and `wrong_password`
            (`password`); `invalid_password` is on `current_password` (password change)
            or `password` (account deletion); `reset_token_invalid` is on `reset_token`.
        attempts_left:
          type: integer
          minimum: 0
          description: 'Only on `code_invalid`: how many wrong tries the email code
            still allows.'
        min_length:
          type: integer
          minimum: 1
          description: 'Only on `password_too_short`: the shortest password the server
            accepts.'
        max_length:
          type: integer
          minimum: 1
          description: 'Only on `password_too_long`: the longest password the server
            accepts.'
      required:
      - attr
      - code
      - detail
    ErrorResponse:
      type: object
      description: '``client_error``: a 401, 403, 404, 409 or 429 answer; ``Retry-After``
        accompanies a 429.'
      properties:
        type:
          $ref: '#/components/schemas/ClientErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    LanguageEnum:
      enum:
      - en
      - ar
      type: string
      description: |-
        * `en` - English
        * `ar` - Arabic
    PasswordResetConfirmRequest:
      type: object
      properties:
        reset_token:
          type: string
          writeOnly: true
          minLength: 1
          description: The `reset_token` that `auth_password_reset_verify` returned.
            It works once.
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: The new password, under the same rules as at registration.
      required:
      - password
      - reset_token
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    PasswordResetVerifyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 1
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
      required:
      - code
      - email
    PatchedProfileUpdateRequest:
      type: object
      description: Only the name can be edited here; any other field is refused instead
        of silently ignored.
      properties:
        name:
          type: string
          minLength: 1
          description: The display name, 1 to 100 characters, trimmed.
          maxLength: 100
    PlatformEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
        * `web` - Web
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
        time_zone:
          type: string
          readOnly: true
      required:
      - email
      - id
      - language
      - name
      - time_zone
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 2048
        device:
          $ref: '#/components/schemas/DeviceRequest'
      required:
      - device
      - refresh_token
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: 'Send it as `Authorization: Bearer`.'
        refresh_token:
          type: string
          description: Single-use. Absent when the web form of the tokens carries
            it in a cookie.
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          description: Seconds the access token lives (600).
      required:
      - access_token
      - expires_in
      - token_type
    RegisterRequest:
      type: object
      description: '``language`` and ``time_zone``: the device the user signs in on
        decides them.'
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: At least 15 characters; no other composition rule. It must
            not resemble the name or email, be a very common password or appear in
            a known data breach.
      required:
      - email
      - name
      - password
    RegisterResponse:
      type: object
      properties:
        code_expires_in:
          type: integer
          description: Seconds until the code expires.
        resend_available_in:
          type: integer
          description: Seconds until a new code may be requested.
        email:
          type: string
          format: email
      required:
      - code_expires_in
      - email
      - resend_available_in
    ResendCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    ResetTokenResponse:
      type: object
      properties:
        reset_token:
          type: string
          description: Single use. Send it, with the new password, to `auth_password_reset_confirm`.
        expires_in:
          type: integer
          description: Seconds until the reset token expires (600).
      required:
      - expires_in
      - reset_token
    ServerErrorEnum:
      enum:
      - server_error
      type: string
      description: '* `server_error` - Server Error'
    ServerErrorResponse:
      type: object
      description: '``server_error``: a 503 answer, always with ``Retry-After``; its
        one code is ``service_unavailable``.'
      properties:
        type:
          $ref: '#/components/schemas/ServerErrorEnum'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      required:
      - errors
      - type
    SignInRequest:
      type: object
      description: '``language`` and ``time_zone``: the device the user signs in on
        decides them.'
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
        captcha_token:
          type: string
          writeOnly: true
          description: The token of a solved Cloudflare Turnstile widget created with
            the action `sign_in`. Required only after `captcha_required`; it is single
            use and lives five minutes.
          maxLength: 2048
        device:
          $ref: '#/components/schemas/DeviceRequest'
      required:
      - device
      - email
      - password
    SignOutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Lets a device whose access token has expired end its own session
            without refreshing first.
          maxLength: 2048
    SignedInResponse:
      type: object
      properties:
        access_token:
          type: string
          description: 'Send it as `Authorization: Bearer`.'
        refresh_token:
          type: string
          description: Single-use. Absent when the web form of the tokens carries
            it in a cookie.
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          description: Seconds the access token lives (600).
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access_token
      - expires_in
      - token_type
      - user
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
      required:
      - email
      - id
      - name
    VerifyEmailRequest:
      type: object
      description: '``language`` and ``time_zone``: the device the user signs in on
        decides them.'
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            `en` or `ar`; the app sends `en` when the device language is neither.

            * `en` - English
            * `ar` - Arabic
        time_zone:
          type: string
          minLength: 1
          description: An IANA name such as `Europe/Moscow`. Leave it out when the
            device cannot read it.
          maxLength: 64
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 1
          description: The 6-digit code from the email.
          pattern: ^[0-9]{6}$
        device:
          $ref: '#/components/schemas/DeviceRequest'
      required:
      - code
      - device
      - email
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
