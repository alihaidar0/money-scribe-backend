          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: Whole seconds to wait before the request may be repeated;
