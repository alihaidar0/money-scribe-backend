      - version
    RepaymentInputRequest:
      type: object
      description: |-
        A repayment to add or to change. It is in the debt's currency; a `currency` here is `400 read_only`.

        The debt is in the context (``debt``): its currency reads the amount.
      properties:
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: In the currency of the debt, greater than 0 and not more than
            what remains (`400 exceeds_remaining`, which also carries `remaining`).
        date:
          type: string
          format: date
          description: A calendar day, 2000-01-01 to 2099-12-31. Not before the debt's
