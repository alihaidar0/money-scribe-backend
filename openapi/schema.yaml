  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Trades the single-use refresh token for a new access token and
        a new refresh token. If the answer is lost, the same refresh token sent again
        within 30 seconds of the rotation returns the same new pair; an older used
        token ends the session. Errors: `401` `token_invalid`, `session_expired`,
        `session_signed_out`, `session_revoked_by_user`, `session_password_changed`,
        `session_email_changed` or `session_token_reuse`; all are final, so sign in
        again.'
      summary: Refresh the tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
