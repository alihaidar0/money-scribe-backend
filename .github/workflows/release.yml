# ============================================================
#  .github/workflows/release.yml
#
#  Publishes a GitHub Release when a promotion lands on main. The Releases
#  page is the changelog; nothing is committed back to a protected branch.
#  Notes are generated by GitHub from the merged pull requests since the
#  previous release, grouped by label (.github/release.yml); pr-labels.yml adds
#  the labels from each PR's Conventional Commit title.
#
#    template repository   calendar versions (vYYYY.MM.DD, then vYYYY.MM.DD.1 …);
#                          documentation-only promotions do not release. The tag
#                          tells a project which state of the template it was
#                          created from (scripts/init-readme.sh records it).
#    generated project     the `version` in pyproject.toml (1.4.0 → v1.4.0).
#                          Raise it in the develop → main release PR; a release
#                          is published once per version and skipped while the
#                          tag already exists. It then starts the Docker
#                          workflow on that tag, because a tag created with the
#                          workflow token does not trigger other workflows.
#
#  Tags matching v* are immutable (see .github/rulesets/protect-tags.json).
# ============================================================

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/CODEOWNERS"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  template-release:
    name: Publish template release
    if: ${{ github.event.repository.is_template }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done
          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --generate-notes \
            --latest
          echo "Published release $tag" >> "$GITHUB_STEP_SUMMARY"

  # The project's own releases. Inert in the template and until the project has
  # a manage.py and a version to release.
  app-release:
    name: Publish app release
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write   # start the Docker workflow on the new tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release for the pyproject.toml version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          PUBLISH_IMAGE: ${{ vars.PUBLISH_IMAGE }}
        run: |
          set -euo pipefail
          if [[ ! -f manage.py || ! -f pyproject.toml ]]; then
            echo "No Django project yet — nothing to release."
            exit 0
          fi

          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pyproject.toml needs a semantic 'version' such as 1.0.0 (found '${version:-none}')."
            exit 1
          fi

          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Release $tag already exists — raise the version in pyproject.toml to publish a new one."
            echo "Release $tag already exists; nothing published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          flags=(--latest)
          if [[ "$version" == *-* ]]; then
            flags=(--prerelease)
          fi

          # The API contract travels with the release, so a client developer pins a tagged,
          # immutable file instead of copying one from a commit. Assets must be attached
          # when the release is created (release immutability forbids adding them later).
          # A project without openapi/schema.yaml simply has no asset.
          assets=()
          if [[ -f openapi/schema.yaml ]]; then
            cp openapi/schema.yaml "$RUNNER_TEMP/openapi.yaml"
            assets+=("$RUNNER_TEMP/openapi.yaml#OpenAPI contract (openapi.yaml)")
          fi

          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --generate-notes \
            "${flags[@]}" \
            "${assets[@]}"
          echo "Published release $tag" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${#assets[@]}" -gt 0 ]]; then
            echo "Attached the API contract as openapi.yaml." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Publishes the semver image tags (X.Y.Z and X.Y), but only for a project
          # that opted in to publishing (repository variable PUBLISH_IMAGE).
          if [[ -n "$PUBLISH_IMAGE" ]]; then
            gh workflow run docker.yml --ref "$tag"
          else
            echo "Image publishing is off (PUBLISH_IMAGE is not set); only the GitHub Release was created." >> "$GITHUB_STEP_SUMMARY"
          fi
