# ============================================================
#  .github/workflows/release.yml
#
#  Keeps the project's DRAFT releases current; the owner publishes. The Releases
#  page is the changelog; nothing is committed back to a protected branch.
#  Notes are generated by GitHub from the merged pull requests since the
#  previous release, grouped by label (.github/release.yml); pr-labels.yml adds
#  the labels from each PR's Conventional Commit title.
#
#    template repository   calendar versions (vYYYY.MM.DD, then vYYYY.MM.DD.1 …),
#                          published on a merge into main; documentation-only
#                          promotions do not release. The tag tells a project which
#                          state of the template it was created from
#                          (scripts/init-readme.sh records it).
#    generated project     two drafts, kept by scripts/release-draft.sh:
#                            develop → the rolling pre-release draft "Staging"
#                                      (replaced by every merge, never published);
#                            main    → the draft "v<version>" for the `version` in
#                                      pyproject.toml (replaced by every merge until
#                                      the owner publishes it from the Releases page).
#                          Both carry openapi/schema.yaml as `openapi.yaml`. Publishing
#                          creates the tag, which starts the Docker workflow for the
#                          X.Y.Z and X.Y image tags. A published release is immutable:
#                          raise the version to prepare the next one.
#
#  Tags matching v* are immutable (see .github/rulesets/protect-tags.json).
# ============================================================

name: Release

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/CODEOWNERS"

# One run at a time per branch, so a refresh never races another one on the same draft.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  template-release:
    name: Publish template release
    if: ${{ github.event.repository.is_template && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while gh release view "$tag" > /dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            tag="$base.$n"
            n=$((n + 1))
          done
          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "$tag" \
            --generate-notes \
            --latest
          echo "Published release $tag" >> "$GITHUB_STEP_SUMMARY"

  # The project's own drafts. Inert in the template and until the project has a
  # manage.py and a version to release (scripts/release-draft.sh checks both).
  app-draft:
    name: Refresh the draft release
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and tags: the script treats an existing tag as a published version.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/release-draft.sh
